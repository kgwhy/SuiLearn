openapi: 3.0.3
info:
  title: SuiLearn V2 API
  version: 0.2.0
  description: >
    API contract for the Java backend AI/RAG service and the React Web knowledge base workbench.
    File ingestion, document reprocessing, knowledge-point generation, and knowledge-point interview
    question generation use persisted asynchronous tasks. API responses expose only user-safe resource
    references and API hrefs; internal queues, object-storage keys, credentials, and raw model output are
    never part of this contract.
servers:
  - url: http://localhost:8080
paths:
  /api/v2/knowledge-bases:
    get:
      summary: List knowledge bases
      responses:
        "200":
          description: Knowledge base list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeBase"
    post:
      summary: Create a knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeBaseRequest"
      responses:
        "200":
          description: Created knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
  /api/v2/knowledge-bases/{knowledgeBaseId}:
    get:
      summary: Get knowledge base detail
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      responses:
        "200":
          description: Knowledge base detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseDetail"
    patch:
      summary: Rename a knowledge base
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameKnowledgeBaseRequest"
      responses:
        "200":
          description: Updated knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
    delete:
      summary: Delete a knowledge base
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      responses:
        "204":
          description: Deleted
  /api/v2/knowledge-bases/{knowledgeBaseId}/questions:
    get:
      summary: List questions saved in a knowledge base
      description: Lightweight workbench view for knowledge base detail. Full Web practice flow belongs to the next phase.
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      responses:
        "200":
          description: Question summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionSummary"
  /api/v2/knowledge-bases/{knowledgeBaseId}/statistics:
    get:
      summary: Get lightweight learning statistics for a knowledge base
      description: Supports the second-version Web workbench detail page without introducing the full Web learning flow.
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      responses:
        "200":
          description: Knowledge base statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseStatistics"
  /api/v2/knowledge-bases/{knowledgeBaseId}/answers:
    post:
      summary: Submit a learning answer record for a saved question
      description: >
        Records user-visible learning results for saved questions. Clients submit
        the already evaluated correctness so Android local practice and future Web
        practice can share the same statistics aggregation without exposing formal
        answers through the summary endpoint.
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswerRequest"
      responses:
        "200":
          description: Persisted answer record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerRecord"
  /api/v2/knowledge-bases/{knowledgeBaseId}/materials:
    get:
      summary: List materials in a knowledge base
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      responses:
        "200":
          description: Material list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningMaterial"
    post:
      summary: Upload an original material file
      description: >
        The primary path streams a Markdown, TXT, PDF, DOC, or DOCX original file, persists the original,
        and submits durable asynchronous processing. It returns after the material, task, and delivery intent
        are committed; parsing, OCR, indexing, and AI work never run to completion in this request thread.
        application/json remains for one compatibility cycle only and is deprecated; new clients must use
        multipart/form-data. The legacy JSON path may retain its historical 200 response while it is supported.
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadMaterialFormData"
          application/json:
            schema:
              $ref: "#/components/schemas/ImportMaterialRequest"
      responses:
        "202":
          description: Original saved and durable material-processing task submitted
          headers:
            Location:
              description: API href for the submitted task.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialTaskSubmission"
        "200":
          description: >
            Deprecated compatibility response for application/json text import only. It records the historical
            synchronous response shape and is not the success semantics for the multipart primary path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningMaterial"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v2/materials/{materialId}:
    get:
      summary: Get material detail
      description: >
        Returns processing state, current revision metadata, and user-safe asset availability. Large reading
        content and binaries are fetched through dedicated API endpoints. Internal object-storage identifiers,
        credentials, and permanent signed URLs are never returned.
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "200":
          description: Material detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetail"
    delete:
      summary: Delete material
      description: Soft deletes the material, removes it from future RAG/search/generation, invalidates chunks and embeddings, deletes pending generated content by default, and keeps already saved questions or AI notes with deleted-source SourceRef metadata.
      parameters:
        - $ref: "#/components/parameters/MaterialId"
        - in: query
          name: savedContentPolicy
          schema:
            $ref: "#/components/schemas/DeletedMaterialSavedContentPolicy"
          description: Policy for questions or AI notes already saved from this material. Default is KEEP_SAVED_CONTENT.
        - in: query
          name: pendingContentPolicy
          schema:
            $ref: "#/components/schemas/DeletedMaterialPendingContentPolicy"
          description: Policy for pending generated drafts sourced from this material. Default is DELETE_PENDING_GENERATED_CONTENT.
      responses:
        "200":
          description: Material deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDeletionResult"
  /api/v2/materials/{materialId}/original:
    get:
      summary: View the original material through the API
      description: >
        Proxies the original binary with inline content disposition. Legacy text-only materials return 404
        with error code MATERIAL_ORIGINAL_UNAVAILABLE and reason LEGACY_NO_ORIGINAL. No MinIO object key,
        credential, or permanent signed URL is exposed.
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "200":
          description: Original file binary
          headers:
            Content-Disposition:
              description: Inline disposition with a safely encoded display filename.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/MaterialOriginalUnavailable"
  /api/v2/materials/{materialId}/original/download:
    get:
      summary: Download the original material through the API
      description: >
        Proxies the private original binary as an attachment. Legacy text-only materials have no original
        and return MATERIAL_ORIGINAL_UNAVAILABLE rather than a fabricated file reference.
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "200":
          description: Original file download
          headers:
            Content-Disposition:
              description: Attachment disposition with a safely encoded display filename.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/MaterialOriginalUnavailable"
  /api/v2/materials/{materialId}/reading:
    get:
      summary: Get the complete reading representation
      description: >
        Returns the complete safe reading representation for the current revision by default, or for a
        specified immutable revision. The response is separate from list/detail payloads so large documents
        are not embedded in ordinary material responses.
      parameters:
        - $ref: "#/components/parameters/MaterialId"
        - in: query
          name: revisionId
          schema:
            type: string
          description: Immutable revision to read. Omit to use the material's current revision.
      responses:
        "200":
          description: Complete reading representation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialReadingDocument"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/materials/{materialId}/revisions/current:
    get:
      summary: Get the current immutable material revision
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "200":
          description: Current revision with ordered blocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevision"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/materials/{materialId}/revisions/{revisionId}:
    get:
      summary: Get a specified immutable material revision
      parameters:
        - $ref: "#/components/parameters/MaterialId"
        - $ref: "#/components/parameters/RevisionId"
      responses:
        "200":
          description: Specified revision with ordered blocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevision"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/materials/{materialId}/reprocess:
    post:
      summary: Submit asynchronous material reprocessing
      description: >
        Creates a new durable task. Successful processing creates a new immutable revision and never overwrites
        prior revisions. The request returns before parsing, OCR, normalization, or indexing completes. A
        LEGACY_TEXT material has no original asset to reprocess and returns 409 with code LEGACY_NO_ORIGINAL;
        clients may instead generate structured knowledge points from its existing immutable legacy revision.
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "202":
          description: Reprocessing task submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSubmission"
        "409":
          $ref: "#/components/responses/LegacyMaterialReprocessConflict"
  /api/v2/materials/{materialId}/knowledge-point-generations:
    post:
      summary: Submit asynchronous structured knowledge-point generation
      description: >
        Generates a new batch of DRAFT knowledge points from a READY material revision. Existing CONFIRMED
        knowledge points are never overwritten. The request returns before AI generation completes. A
        LEGACY_TEXT revision is a valid evidence source for creating a new structured batch even though its
        legacy knowledge-point records and missing original asset remain ineligible for direct question generation.
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateKnowledgePointsRequest"
      responses:
        "202":
          description: Knowledge-point generation task submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSubmission"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v2/materials/{materialId}/extract-knowledge-points:
    post:
      summary: Extract editable knowledge points from material (deprecated)
      deprecated: true
      description: >
        Deprecated compatibility endpoint for one cycle. It may preserve the historical 200 result shape,
        but new clients must POST /api/v2/materials/{materialId}/knowledge-point-generations and poll the
        returned task. This endpoint is not the asynchronous primary path.
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "200":
          description: Extracted knowledge points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePointExtractionResult"
  /api/v2/knowledge-bases/{knowledgeBaseId}/knowledge-points:
    get:
      summary: List extracted or generated knowledge points
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      responses:
        "200":
          description: Knowledge point list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgePoint"
  /api/v2/knowledge-points/{knowledgePointId}:
    get:
      summary: Get structured knowledge-point detail
      parameters:
        - $ref: "#/components/parameters/KnowledgePointId"
      responses:
        "200":
          description: Knowledge-point detail with immutable source citations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePoint"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Edit a knowledge-point draft or reviewable structured content
      description: Status transitions are performed by the explicit confirm or reject review endpoints.
      parameters:
        - $ref: "#/components/parameters/KnowledgePointId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKnowledgePointRequest"
      responses:
        "200":
          description: Updated knowledge point
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePoint"
    delete:
      summary: Archive a knowledge point
      description: Soft-archives the knowledge point as ARCHIVED so it cannot be used as a formal source.
      parameters:
        - $ref: "#/components/parameters/KnowledgePointId"
      responses:
        "204":
          description: Deleted
  /api/v2/knowledge-points/{knowledgePointId}/confirm:
    post:
      summary: Confirm a reviewed knowledge point
      description: >
        Transitions a valid reviewed DRAFT to CONFIRMED. Only CONFIRMED knowledge points may be used for
        formal search, focused learning, or interview-question generation.
      parameters:
        - $ref: "#/components/parameters/KnowledgePointId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgePointReviewRequest"
      responses:
        "200":
          description: Confirmed knowledge point
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePoint"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v2/knowledge-points/{knowledgePointId}/reject:
    post:
      summary: Reject a reviewed knowledge point
      description: Rejects a draft while retaining the necessary audit state; it is not a formal source.
      parameters:
        - $ref: "#/components/parameters/KnowledgePointId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgePointReviewRequest"
      responses:
        "200":
          description: Rejected knowledge point
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePoint"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v2/knowledge-points/{knowledgePointId}/interview-question-generations:
    post:
      summary: Submit asynchronous interview-question generation for a knowledge point
      x-suilearn-resource-precondition-schema: "#/components/schemas/QuestionGenerationEligibleKnowledgePoint"
      description: >
        Accepts only StructuredKnowledgePoint records with legacy=false, status=CONFIRMED,
        sourceOutdated=false, and at least one currently valid immutable citation. Legacy knowledge points must
        be regenerated as structured drafts and confirmed first. The default request generates one MEDIUM
        SHORT_ANSWER question. A successful submission returns before AI work completes; generated items remain
        PENDING_REVIEW until the existing save or discard review gate is used.
      parameters:
        - $ref: "#/components/parameters/KnowledgePointId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateKnowledgePointQuestionsRequest"
      responses:
        "202":
          description: Interview-question generation task submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSubmission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/KnowledgePointQuestionGenerationConflict"
  /api/v2/ai/generated-questions:
    post:
      summary: Generate one question draft from source (deprecated)
      deprecated: true
      description: >
        Deprecated compatibility endpoint for generic single-draft generation. New knowledge-point interview
        questions use /api/v2/knowledge-points/{knowledgePointId}/interview-question-generations, which always
        returns a durable 202 task submission and supports batches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateQuestionRequest"
      responses:
        "200":
          description: Pending review question draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedQuestionDraft"
  /api/v2/ai/knowledge-point-explanations:
    post:
      summary: Generate a knowledge point explanation
      description: >
        Creates a persisted generation task. The response must not contain provider raw
        output or secrets; only the reviewed draft shape is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateExplanationRequest"
      responses:
        "200":
          description: Explanation draft that can be saved as an AI note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiNoteDraft"
  /api/v2/ai/review-suggestions:
    post:
      summary: Generate review suggestions from answer history, weak knowledge points, or wrong questions
      description: >
        Creates a persisted generation task. The task records provider type/model metadata
        and error summaries, never API keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateReviewSuggestionRequest"
      responses:
        "200":
          description: Review suggestion draft that can be saved as an AI note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiNoteDraft"
  /api/v2/ai/notes:
    post:
      summary: Save an AI explanation, review suggestion, or RAG answer as a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAiNoteRequest"
      responses:
        "200":
          description: Saved AI note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedAiNote"
  /api/v2/ai/generated-contents:
    get:
      summary: List generated contents
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/GeneratedContentStatus"
        - in: query
          name: generationTaskId
          schema:
            type: string
          description: Limit results to one asynchronous generation batch.
        - in: query
          name: knowledgePointId
          schema:
            type: string
          description: Limit results to drafts generated from one knowledge point.
      responses:
        "200":
          description: Generated contents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedQuestionDraft"
  /api/v2/ai/generated-contents/{generatedContentId}:
    patch:
      summary: Save, edit, or discard generated content
      description: >
        Request schema is selected from the persisted generated-content kind, not from a client-controlled
        source identifier. Knowledge-point interview-question drafts use the locked review branch and cannot
        modify knowledgePointId, citations, sourceRefs, generationTaskId, or their plural aliases. Other existing
        generated-question drafts continue through the deprecated generic compatibility branch.
      parameters:
        - $ref: "#/components/parameters/GeneratedContentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewGeneratedContentRequest"
      responses:
        "200":
          description: Updated generated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedQuestionDraft"
    delete:
      summary: Soft delete generated content
      parameters:
        - $ref: "#/components/parameters/GeneratedContentId"
      responses:
        "204":
          description: Deleted
  /api/v2/ai/provider-status:
    get:
      summary: Get sanitized AI provider runtime status
      description: >
        Returns non-secret provider configuration needed by clients to decide whether AI
        features are available. The response must never include API keys, raw authorization
        headers, or provider secret values.
      responses:
        "200":
          description: Sanitized AI provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderStatus"
  /api/v2/search:
    get:
      summary: Semantic search across questions, knowledge points, material chunks, and generated content
      description: >
        Search is always scoped. Clients must provide at least one of knowledgeBaseId or materialId.
        The API does not perform implicit global search. If both are provided, materialId must belong to
        knowledgeBaseId and the search is narrowed to that material.
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
        - in: query
          name: knowledgeBaseId
          schema:
            type: string
          description: Required unless materialId is provided. Limits search to one knowledge base.
        - in: query
          name: materialId
          schema:
            type: string
          description: Required unless knowledgeBaseId is provided. Limits search to one material.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Maximum results to return after scope filtering.
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
  /api/v2/rag/ask:
    post:
      summary: Ask a question within a knowledge base or material scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskQuestionRequest"
      responses:
        "200":
          description: RAG answer with citations and uncertainty flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagAnswer"
  /api/v2/agent/capabilities:
    get:
      summary: List registered v2 Agent capabilities and declarative tool schemas
      description: >
        Enumerates built-in capabilities, each capability's owned tools, and every registered tool's
        OpenAI-compatible function schema. The endpoint is gated by suilearn.agent.enabled and returns
        sanitized metadata only; no prompts, user content, model output, or secrets are included.
      responses:
        "200":
          description: Capability and tool registry descriptors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCapabilitiesResponse"
        "404":
          $ref: "#/components/responses/AgentTurnNotFound"
        "503":
          $ref: "#/components/responses/AgentTurnUnavailable"
  /api/v2/agent/turns:
    post:
      summary: Start a v2 Agent turn and wait synchronously for its terminal event
      description: >
        Synchronous convenience wrapper over the v2 Agent turn runtime. The turn, the user message, and the
        first turn_started event are persisted in one transaction before the caller waits for the unique
        terminal event. learnerId is a caller-provided logical scope, not an authenticated identity. At least
        knowledgeBaseId or materialId is required. This is the only v2 Agent turn entry point; the legacy synchronous study endpoint has been removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAgentTurnRequest"
      responses:
        "200":
          description: Terminal turn result snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTurnResult"
        "400":
          $ref: "#/components/responses/AgentTurnBadRequest"
        "404":
          $ref: "#/components/responses/AgentTurnNotFound"
        "409":
          $ref: "#/components/responses/AgentTurnConflict"
        "503":
          $ref: "#/components/responses/AgentTurnUnavailable"
  /api/v2/agent/turns/{turnId}/events:
    get:
      summary: Replay persisted turn events after afterSeq
      description: >
        REST equivalent of subscribe_turn/resume_from. Events are ordered by seq and belong only to turnId.
      parameters:
        - in: path
          name: turnId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - in: query
          name: afterSeq
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Replayed event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTurnEventPage"
        "400":
          $ref: "#/components/responses/AgentTurnBadRequest"
        "404":
          $ref: "#/components/responses/AgentTurnNotFound"
        "503":
          $ref: "#/components/responses/AgentTurnUnavailable"
  /api/v2/agent/turns/{turnId}/cancel:
    post:
      summary: Cancel an active v2 Agent turn
      parameters:
        - in: path
          name: turnId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Current turn status after cancellation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTurnControlResponse"
        "400":
          $ref: "#/components/responses/AgentTurnBadRequest"
        "404":
          $ref: "#/components/responses/AgentTurnNotFound"
        "409":
          $ref: "#/components/responses/AgentTurnConflict"
        "503":
          $ref: "#/components/responses/AgentTurnUnavailable"
  /api/v2/agent/turns/{turnId}/reply:
    post:
      summary: Deliver a reply to a WAITING_INPUT Agent turn
      parameters:
        - in: path
          name: turnId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTurnReplyRequest"
      responses:
        "200":
          description: Current turn status after accepting the reply command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTurnControlResponse"
        "400":
          $ref: "#/components/responses/AgentTurnBadRequest"
        "404":
          $ref: "#/components/responses/AgentTurnNotFound"
        "409":
          $ref: "#/components/responses/AgentTurnConflict"
        "503":
          $ref: "#/components/responses/AgentTurnUnavailable"
  /api/v2/agent/sessions/{sessionId}/active-turn:
    get:
      summary: Check the current active turn for a session
      description: >
        Returns the active RUNNING or WAITING_INPUT turn if one exists. A persisted RUNNING turn that has no
        live runtime handle is treated as an orphan, marked FAILED_ORPHANED, and reported as such.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Active turn information; turnId and status are null when no active turn exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTurnActiveResponse"
        "400":
          $ref: "#/components/responses/AgentTurnBadRequest"
        "404":
          $ref: "#/components/responses/AgentTurnNotFound"
        "503":
          $ref: "#/components/responses/AgentTurnUnavailable"
  /api/v2/tasks/{taskId}:
    get:
      summary: Get generation, material import, or embedding task status
      description: >
        Unified persisted task status endpoint for document processing, embedding, knowledge-point generation,
        and question generation. Work is performed outside the HTTP request thread and can remain queued,
        running, or waiting for retry across process restarts.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatus"
  /api/v2/tasks/{taskId}/knowledge-points:
    get:
      summary: List structured knowledge-point drafts produced by a generation task
      description: >
        Returns only the new StructuredKnowledgePoint records created by this task. Every item has
        generationTaskId equal to taskId and status DRAFT; pre-existing or CONFIRMED knowledge points are excluded.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Structured DRAFT knowledge-point batch for this task
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedKnowledgePointDraft"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/tasks/{taskId}/question-drafts:
    get:
      summary: List question drafts produced by a generation task
      description: >
        Returns the batch produced so far. Every generated item remains PENDING_REVIEW until explicitly saved
        or discarded through /api/v2/ai/generated-contents/{generatedContentId}.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Pending-review question draft batch
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingReviewKnowledgePointQuestionDraft"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    KnowledgeBaseId:
      in: path
      name: knowledgeBaseId
      required: true
      schema:
        type: string
    MaterialId:
      in: path
      name: materialId
      required: true
      schema:
        type: string
    GeneratedContentId:
      in: path
      name: generatedContentId
      required: true
      schema:
        type: string
    KnowledgePointId:
      in: path
      name: knowledgePointId
      required: true
      schema:
        type: string
    TaskId:
      in: path
      name: taskId
      required: true
      schema:
        type: string
    RevisionId:
      in: path
      name: revisionId
      required: true
      schema:
        type: string
      description: Immutable document revision identifier.
    LearnerId:
      in: path
      name: learnerId
      required: true
      description: Caller-provided learner scope for the trusted single-user MVP; not an authenticated identity.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    BadRequest:
      description: Invalid request or field validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found or unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Resource state does not allow the requested transition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    PayloadTooLarge:
      description: Uploaded file exceeds the configured size or document limits
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnsupportedMediaType:
      description: File extension, declared MIME, detected signature, or supported format validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    MaterialOriginalUnavailable:
      description: Original material asset is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MaterialOriginalUnavailableError"
    LegacyMaterialReprocessConflict:
      description: Legacy text-only material has no original asset to reprocess
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyMaterialReprocessError"
    KnowledgePointQuestionGenerationConflict:
      description: Knowledge point is not eligible for interview-question generation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/KnowledgePointQuestionGenerationConflictError"
    AgentTurnBadRequest:
      description: Invalid v2 Agent turn request or scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentTurnError"
    AgentTurnNotFound:
      description: Agent feature is disabled or the requested turn/session does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentTurnError"
    AgentTurnConflict:
      description: The turn is terminal, not waiting for input, or the session already has an active turn
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentTurnError"
    AgentTurnUnavailable:
      description: A required v2 Agent turn runtime dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentTurnError"
  schemas:
    NonBlankText:
      type: string
      minLength: 1
      pattern: '^[\s\S]*\S[\s\S]*$'
      description: >
        Must contain at least one non-whitespace character after trim validation. The pattern supports multiline
        content; the server must also trim and reject Unicode-only blank input before persistence.
    ApiError:
      type: object
      required: [code, message]
      description: >
        User-safe API error. message and fieldErrors are sanitized and never contain file bodies, object keys,
        credentials, authorization headers, internal queue names, or raw model/adapter responses.
      properties:
        code:
          $ref: "#/components/schemas/NonBlankText"
          description: Stable machine-readable error code.
        message:
          $ref: "#/components/schemas/NonBlankText"
          description: Short user-safe corrective message.
        correlationId:
          type: string
          description: Opaque support correlation id; safe to provide to operators.
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          $ref: "#/components/schemas/NonBlankText"
    StartAgentTurnRequest:
      type: object
      required: [learnerId, message, scope]
      description: >
        v2 Agent turn start request. The server normalizes and validates scope before constructing
        TurnContext. learnerId is a logical scope identifier, not an authenticated identity.
      properties:
        learnerId:
          type: string
          minLength: 1
          maxLength: 128
        sessionId:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional; the server generates one when omitted.
        message:
          type: string
          minLength: 1
          maxLength: 8000
          description: User-visible message content; never persisted in turn_events metadata.
        capability:
          type: string
          minLength: 1
          maxLength: 64
          default: study_agent
          description: Optional capability name. Only registered capabilities are accepted by the server.
        scope:
          $ref: "#/components/schemas/AgentTurnScope"
        attachments:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/AgentTurnAttachment"
    AgentTurnScope:
      type: object
      anyOf:
        - required: [knowledgeBaseId]
        - required: [materialId]
      description: Server-validated mandatory study scope for this turn.
      properties:
        knowledgeBaseId:
          type: string
          minLength: 1
          maxLength: 128
        materialId:
          type: string
          minLength: 1
          maxLength: 128
    AgentTurnAttachment:
      type: object
      required: [attachmentId, reference]
      properties:
        attachmentId:
          type: string
          minLength: 1
          maxLength: 128
        mediaType:
          type: string
          minLength: 1
          maxLength: 128
        reference:
          type: string
          minLength: 1
          maxLength: 512
    AgentTurnReplyRequest:
      type: object
      anyOf:
        - required: [text]
        - required: [answers]
      properties:
        text:
          type: string
          maxLength: 8000
        answers:
          type: object
          additionalProperties: true
    AgentTurnEventPage:
      type: object
      required: [turnId, afterSeq, lastSeq, events]
      properties:
        turnId:
          type: string
        afterSeq:
          type: integer
          format: int64
          minimum: 0
        lastSeq:
          type: integer
          format: int64
          minimum: 0
        events:
          type: array
          items:
            $ref: "#/components/schemas/AgentTurnEvent"
    AgentTurnEvent:
      type: object
      required: [turnId, sessionId, seq, type, content, metadata, ts]
      description: >
        Sanitized structured turn event. metadata MUST NOT contain user message text, prompts, raw model
        output, or API keys.
      properties:
        turnId:
          type: string
        sessionId:
          type: string
        seq:
          type: integer
          format: int64
          minimum: 1
        type:
          $ref: "#/components/schemas/AgentTurnEventType"
        source:
          type: string
          nullable: true
        stage:
          type: string
          nullable: true
        content:
          type: string
        metadata:
          type: object
          additionalProperties: true
        ts:
          type: string
          format: date-time
    AgentTurnEventType:
      type: string
      enum:
        [turn_started, stage_start, stage_end, thinking, content, tool_call, tool_result,
         progress, sources, result, error, wait_for_input, done, cancelled, failed,
         active_turn_info]
    AgentTurnResult:
      type: object
      required: [turnId, sessionId, status, lastSeq, terminalEvent, createdAt, finishedAt,
                 promptTokens, completionTokens, usageCostUsd, actionTraceCount, estimatedContextTokens]
      properties:
        turnId:
          type: string
        sessionId:
          type: string
        status:
          $ref: "#/components/schemas/AgentTurnStatus"
        lastSeq:
          type: integer
          format: int64
          minimum: 1
        terminalEvent:
          $ref: "#/components/schemas/AgentTurnEvent"
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        promptTokens:
          type: integer
          format: int64
          minimum: 0
        completionTokens:
          type: integer
          format: int64
          minimum: 0
        usageCostUsd:
          type: number
          format: double
          minimum: 0
        actionTraceCount:
          type: integer
          minimum: 0
        estimatedContextTokens:
          type: integer
          minimum: 0
    AgentTurnStatus:
      type: string
      enum: [CREATED, RUNNING, WAITING_INPUT, COMPLETED, CANCELLED, FAILED, FAILED_ORPHANED]
    AgentTurnControlResponse:
      type: object
      required: [turnId, status]
      properties:
        turnId:
          type: string
        status:
          $ref: "#/components/schemas/AgentTurnStatus"
    AgentTurnActiveResponse:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
        turnId:
          type: string
          nullable: true
        status:
          type: string
          enum: [CREATED, RUNNING, WAITING_INPUT, COMPLETED, CANCELLED, FAILED, FAILED_ORPHANED, null]
          nullable: true

    AgentCapabilitiesResponse:
      type: object
      required: [capabilities, tools]
      properties:
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/AgentCapabilityDescriptor"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AgentToolDescriptor"
    AgentCapabilityDescriptor:
      type: object
      required: [name, description, ownedTools]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        ownedTools:
          type: array
          uniqueItems: true
          items:
            type: string
    AgentToolDescriptor:
      type: object
      required: [name, description, parameters, deferred, requiredScopes]
      description: >
        OpenAI function-calling compatible tool descriptor. parameters is a JSON Schema object for tool
        arguments. requiredScopes is server-side permission metadata and is never sent to a model as authority.
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        parameters:
          type: object
        deferred:
          type: boolean
        requiredScopes:
          type: array
          uniqueItems: true
          items:
            type: string
    AgentTurnError:
      type: object
      required: [code, message]
      description: >
        Stable sanitized v2 Agent turn error. Never contains user text, prompts, raw model output,
        credentials, queue names, or API keys.
      properties:
        code:
          type: string
          enum:
            [INVALID_AGENT_REQUEST, AGENT_FEATURE_DISABLED, AGENT_WEBSOCKET_DISABLED,
             AGENT_SCOPE_REQUIRED, AGENT_CAPABILITY_UNKNOWN, AGENT_TURN_NOT_FOUND,
             AGENT_TURN_ACTIVE_CONFLICT, AGENT_TURN_NOT_WAITING_FOR_INPUT, AGENT_TURN_TERMINAL,
             AGENT_TURN_TIMEOUT, AGENT_DEPENDENCY_UNAVAILABLE, TURN_EXECUTOR_UNAVAILABLE,
             INVALID_EVENT_PAYLOAD]
        message:
          $ref: "#/components/schemas/NonBlankText"
        correlationId:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    MaterialOriginalUnavailableError:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          required: [code, reason]
          properties:
            code:
              type: string
              enum: [MATERIAL_ORIGINAL_UNAVAILABLE]
            reason:
              $ref: "#/components/schemas/AssetUnavailableReason"
    LegacyMaterialReprocessError:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [LEGACY_NO_ORIGINAL]
    KnowledgePointQuestionGenerationConflictError:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [KNOWLEDGE_POINT_NOT_CONFIRMED, LEGACY_KNOWLEDGE_POINT_REQUIRES_REGENERATION, KNOWLEDGE_POINT_SOURCE_OUTDATED, KNOWLEDGE_POINT_CITATIONS_INVALID]
    CreateKnowledgeBaseRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    RenameKnowledgeBaseRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    KnowledgeBase:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    KnowledgeBaseDetail:
      allOf:
        - $ref: "#/components/schemas/KnowledgeBase"
        - type: object
          description: >
            Lightweight detail counters. Counts are computed from persisted rows in the
            knowledge base and must not be placeholder constants.
          properties:
            materialCount:
              type: integer
              description: Non-deleted materials in this knowledge base.
            knowledgePointCount:
              type: integer
              description: Non-deleted extracted or generated knowledge points in this knowledge base.
            questionCount:
              type: integer
              description: Saved formal questions in this knowledge base, including saved AI-generated questions.
            generatedContentCount:
              type: integer
              description: Generated contents not soft-deleted, including pending review, saved, and discarded items.
            aiNoteCount:
              type: integer
              description: Saved AI notes in this knowledge base.
    QuestionSummary:
      type: object
      required: [id, knowledgeBaseId, questionType, stem, categoryId, categoryName, knowledgePointIds, createdAt, sourceRefs]
      description: >
        Saved formal question summary. Existing difficulty values remain on the 1..5 scale. A question saved
        from a knowledge-point interview draft includes difficultyLevel and uses EASY=2, MEDIUM=3, HARD=4;
        the server performs this mapping and clients never infer it.
      oneOf:
        - not:
            required: [difficultyLevel]
        - allOf:
            - required: [difficulty, difficultyLevel]
            - $ref: "#/components/schemas/FormalQuestionDifficultyMapping"
      properties:
        id:
          type: string
        knowledgeBaseId:
          type: string
        questionType:
          $ref: "#/components/schemas/QuestionType"
        stem:
          $ref: "#/components/schemas/NonBlankText"
        categoryId:
          type: string
        categoryName:
          type: string
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
          description: Formal persisted difficulty. Generated mapping is EASY=2, MEDIUM=3, HARD=4.
        difficultyLevel:
          $ref: "#/components/schemas/QuestionDifficulty"
        knowledgePointIds:
          type: array
          items:
            type: string
        answeredCount:
          type: integer
        correctRate:
          type: number
          format: double
        sourceRefs:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
        createdAt:
          type: string
          format: date-time
        savedAt:
          type: string
          format: date-time
    KnowledgeBaseStatistics:
      type: object
      required: [knowledgeBaseId, questionCount, materialCount, readyMaterialCount, knowledgePointCount, pendingGeneratedContentCount, savedAiNoteCount, answeredQuestionCount, answerCount, wrongQuestionCount]
      description: >
        Lightweight learning statistics for the knowledge base detail page. Values must be
        derived from saved questions and answer records; if no answer records exist, counts
        are zero and correctRate is omitted or null rather than filled with a placeholder.
      properties:
        knowledgeBaseId:
          type: string
        questionCount:
          type: integer
          description: Saved formal questions in the knowledge base.
        materialCount:
          type: integer
          description: Learning materials imported into the knowledge base (excluding deleted).
        readyMaterialCount:
          type: integer
          description: Materials that have finished parsing and indexing and are ready for retrieval.
        knowledgePointCount:
          type: integer
          description: Knowledge points extracted or curated in the knowledge base.
        pendingGeneratedContentCount:
          type: integer
          description: AI-generated drafts currently awaiting user review (PENDING_REVIEW).
        savedAiNoteCount:
          type: integer
          description: AI notes saved into the knowledge base.
        answeredQuestionCount:
          type: integer
          description: Distinct saved questions with at least one answer record.
        answerCount:
          type: integer
          description: Total answer attempts recorded for saved questions in the knowledge base.
        correctRate:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
          description: Correct answers divided by answerCount; null or omitted when answerCount is 0.
        wrongQuestionCount:
          type: integer
          description: Saved questions that currently have at least one unmastered wrong-question record.
        weakKnowledgePointIds:
          type: array
          description: Knowledge point ids ranked as weak by wrong-question or low-correct-rate evidence; empty when there is no evidence.
          items:
            type: string
    SubmitAnswerRequest:
      type: object
      required: [questionId, userAnswer, correct]
      properties:
        questionId:
          type: string
        userAnswer:
          type: array
          minItems: 1
          items:
            type: string
        correct:
          type: boolean
          description: Client-evaluated answer result for the submitted attempt.
        durationMs:
          type: integer
          format: int64
          minimum: 0
    AnswerRecord:
      type: object
      required: [id, knowledgeBaseId, questionId, userAnswer, correct, durationMs, answeredAt]
      properties:
        id:
          type: string
        knowledgeBaseId:
          type: string
        questionId:
          type: string
        userAnswer:
          type: array
          items:
            type: string
        correct:
          type: boolean
        durationMs:
          type: integer
          format: int64
        answeredAt:
          type: string
          format: date-time
    ImportMaterialRequest:
      type: object
      deprecated: true
      required: [title, sourceType, content]
      description: >
        Deprecated JSON text-import shape retained for one compatibility cycle. content is already-textified
        material and does not carry an original file asset. New clients must use UploadMaterialFormData.
      properties:
        title:
          type: string
        fileName:
          type: string
          description: Original client-side file name when the material came from a file.
        sourceType:
          $ref: "#/components/schemas/LegacyMaterialSourceType"
        content:
          type: string
          description: Legacy text body migrated to an immutable LEGACY_TEXT revision.
    UploadMaterialFormData:
      type: object
      required: [file]
      description: >
        Primary raw-file upload shape. The server validates extension, declared MIME, detected signature,
        size, and format before durable submission. The original filename is taken from the file part and
        retained only as display metadata; it is never used as an object-storage key.
      properties:
        title:
          type: string
          description: Optional display title; the safely normalized filename is used when omitted.
        sourceType:
          $ref: "#/components/schemas/MaterialSourceType"
          description: Optional client hint. Server-side format detection remains authoritative.
        file:
          type: string
          format: binary
          description: Markdown, TXT, PDF, DOC, or DOCX original file, up to the configured upload limit.
    LearningMaterial:
      type: object
      required: [id, knowledgeBaseId, title, sourceType, status, originalAvailable, createdAt]
      description: Material list item. Original binaries and full reading content are never embedded here.
      properties:
        id:
          type: string
        knowledgeBaseId:
          type: string
        title:
          type: string
        sourceType:
          $ref: "#/components/schemas/MaterialSourceType"
        status:
          $ref: "#/components/schemas/MaterialStatus"
        importTaskId:
          type: string
          deprecated: true
          description: Deprecated alias for processingTaskId retained for existing clients.
        processingTaskId:
          type: string
          description: Most recent document-processing task id.
        currentRevisionId:
          type: string
          description: Current immutable revision id after successful processing.
        embeddingTaskId:
          type: string
          description: Embedding task id once chunk embedding has started or completed.
        errorMessage:
          type: string
          description: Sanitized failure summary when status is FAILED; never raw adapter/model output.
        originalAvailable:
          type: boolean
          description: False for legacy text-only materials and unavailable/deleted original assets.
        originalUnavailableReason:
          $ref: "#/components/schemas/AssetUnavailableReason"
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
    MaterialDetail:
      allOf:
        - $ref: "#/components/schemas/LearningMaterial"
        - type: object
          required: [assets]
          description: >
            Processing and version metadata. Full reading content and binaries use dedicated endpoints.
            For a legacy material, assets includes ORIGINAL with UNAVAILABLE/LEGACY_NO_ORIGINAL.
          properties:
            content:
              type: string
              deprecated: true
              description: Deprecated legacy body field. Use /materials/{materialId}/reading.
            contentPreview:
              type: string
              description: Short preview for clients that do not need or cannot fetch full content.
            processingTask:
              $ref: "#/components/schemas/TaskStatus"
            currentRevision:
              $ref: "#/components/schemas/DocumentRevisionSummary"
            assets:
              type: array
              items:
                $ref: "#/components/schemas/MaterialAsset"
            chunks:
              type: array
              deprecated: true
              description: Deprecated compatibility projection; ordered revision blocks are authoritative.
              items:
                $ref: "#/components/schemas/MaterialChunk"
            extractedKnowledgePoints:
              type: array
              items:
                $ref: "#/components/schemas/KnowledgePoint"
    MaterialAsset:
      oneOf:
        - $ref: "#/components/schemas/AvailableMaterialAsset"
        - $ref: "#/components/schemas/UnavailableMaterialAsset"
      description: Exactly one available or unavailable user-safe asset representation.
    MaterialAssetBase:
      type: object
      required: [materialId, type, availability]
      description: >
        User-safe asset metadata. href and downloadHref are API endpoints or short-lived server-managed
        access paths; internal bucket names, object keys, credentials, and permanent signed URLs are forbidden.
      properties:
        id:
          type: string
        materialId:
          type: string
          minLength: 1
        revisionId:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/MaterialAssetType"
        availability:
          $ref: "#/components/schemas/AssetAvailability"
        unavailableReason:
          $ref: "#/components/schemas/AssetUnavailableReason"
        mediaType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        href:
          type: string
          description: Relative API href for inline viewing when available.
        downloadHref:
          type: string
          description: Relative API href for attachment download when available.
        createdAt:
          type: string
          format: date-time
    AvailableMaterialAsset:
      allOf:
        - $ref: "#/components/schemas/MaterialAssetBase"
        - type: object
          required: [id, href]
          properties:
            availability:
              type: string
              enum: [AVAILABLE]
          not:
            required: [unavailableReason]
    UnavailableMaterialAsset:
      allOf:
        - $ref: "#/components/schemas/MaterialAssetBase"
        - type: object
          required: [unavailableReason]
          properties:
            availability:
              type: string
              enum: [PENDING, FAILED, UNAVAILABLE, DELETED]
    MaterialAssetType:
      type: string
      enum: [ORIGINAL, READING, PREVIEW, OCR_PAGE]
    AssetAvailability:
      type: string
      enum: [PENDING, AVAILABLE, FAILED, UNAVAILABLE, DELETED]
    AssetUnavailableReason:
      type: string
      enum: [LEGACY_NO_ORIGINAL, PROCESSING, GENERATION_FAILED, DELETED]
    DocumentRevisionSummary:
      type: object
      required: [id, materialId, origin, processingVersion, createdAt]
      description: Immutable parsed-document version metadata.
      properties:
        id:
          type: string
        materialId:
          type: string
        origin:
          $ref: "#/components/schemas/DocumentRevisionOrigin"
        processingVersion:
          type: string
          description: Sanitized parser/normalization pipeline version, not an internal object reference.
        blockCount:
          type: integer
          minimum: 0
        pageCount:
          type: integer
          minimum: 0
        createdByTaskId:
          type: string
        createdAt:
          type: string
          format: date-time
    DocumentRevision:
      allOf:
        - $ref: "#/components/schemas/DocumentRevisionSummary"
        - type: object
          required: [blocks]
          description: Immutable revision with blocks ordered by ordinal.
          properties:
            blocks:
              type: array
              items:
                $ref: "#/components/schemas/DocumentBlock"
    DocumentBlock:
      type: object
      required: [id, revisionId, ordinal, content]
      properties:
        id:
          type: string
        revisionId:
          type: string
        ordinal:
          type: integer
          minimum: 0
          description: Stable zero-based order within the immutable revision.
        sectionPath:
          type: array
          items:
            type: string
        pageNumber:
          type: integer
          minimum: 1
        content:
          type: string
    DocumentRevisionOrigin:
      type: string
      enum: [FILE_IMPORT, REPROCESS, LEGACY_TEXT_MIGRATION]
    MaterialReadingDocument:
      type: object
      required: [materialId, revisionId, origin, mediaType, content, blocks]
      description: Complete safe reading representation for exactly one immutable revision.
      properties:
        materialId:
          type: string
        revisionId:
          type: string
        origin:
          $ref: "#/components/schemas/DocumentRevisionOrigin"
        mediaType:
          type: string
          enum: [text/html, text/plain]
        content:
          type: string
          description: Complete server-sanitized reading body; never an object-storage URL or raw Office/PDF binary.
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/DocumentBlock"
    MaterialChunk:
      type: object
      required: [id, knowledgeBaseId, materialId, content, ordinal, embeddingStatus]
      description: >
        Smallest retrievable unit for semantic search and RAG. The embedding vector itself
        is stored server-side and is not returned by the API.
      properties:
        id:
          type: string
        knowledgeBaseId:
          type: string
        materialId:
          type: string
        content:
          type: string
        ordinal:
          type: integer
        titlePath:
          type: array
          items:
            type: string
          description: Heading path or structural labels used to help users locate the chunk.
        tokenEstimate:
          type: integer
          description: Approximate token count used by retrieval and prompt budgeting.
        embeddingStatus:
          $ref: "#/components/schemas/EmbeddingStatus"
        embeddingModel:
          type: string
          description: Embedding model used for the stored vector value; never an API key or secret.
        embeddingDimensions:
          type: integer
          description: Dimension count of the stored vector, used for migration and compatibility checks.
        sourceRef:
          $ref: "#/components/schemas/SourceRef"
    MaterialDeletionResult:
      type: object
      required: [materialId, status, savedContentPolicy, pendingContentPolicy, invalidatedChunkCount, deletedPendingGeneratedContentCount]
      description: >
        Result of soft-deleting a material. Deleted materials are excluded from future search, RAG, and
        generation. Pending generated drafts sourced from the material are deleted by default. Already
        saved questions and AI notes are kept by default, with their SourceRef.deleted flag set to true.
      properties:
        materialId:
          type: string
        status:
          $ref: "#/components/schemas/MaterialStatus"
        savedContentPolicy:
          $ref: "#/components/schemas/DeletedMaterialSavedContentPolicy"
        pendingContentPolicy:
          $ref: "#/components/schemas/DeletedMaterialPendingContentPolicy"
        invalidatedChunkCount:
          type: integer
        deletedPendingGeneratedContentCount:
          type: integer
        retainedSavedQuestionCount:
          type: integer
        retainedAiNoteCount:
          type: integer
        deletedAt:
          type: string
          format: date-time
    KnowledgePoint:
      oneOf:
        - $ref: "#/components/schemas/StructuredKnowledgePoint"
        - $ref: "#/components/schemas/LegacyKnowledgePoint"
      description: >
        A knowledge point is exactly one structured or legacy representation. The legacy boolean is constrained
        by each branch instead of being used as an OpenAPI discriminator. Only status=CONFIRMED is eligible for
        formal search, focused learning, or interview-question generation.
    KnowledgePointBase:
      type: object
      required: [id, knowledgeBaseId, status, sourceOutdated, legacy]
      description: >
        Shared identity, review state, source freshness, and compatibility fields. Structured learning content
        is defined only by StructuredKnowledgePoint; legacy rows are not silently upgraded from keywords.
      properties:
        id:
          type: string
          minLength: 1
        knowledgeBaseId:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/KnowledgePointStatus"
        sourceOutdated:
          type: boolean
          description: True when no citation points to the material's current revision.
        name:
          type: string
          deprecated: true
          description: Deprecated compatibility name used by legacy knowledge points.
        description:
          type: string
          deprecated: true
          description: Deprecated compatibility description; not a substitute for structured fields.
        sourceMaterialId:
          type: string
          deprecated: true
        sourceRefs:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
    StructuredKnowledgePoint:
      allOf:
        - $ref: "#/components/schemas/KnowledgePointBase"
        - type: object
          required: [generationTaskId, title, shortSummary, definition, principles, applicationScenarios, pitfalls, citations]
          description: >
            Machine-validatable structured learning content. DRAFT and CONFIRMED records both carry complete,
            non-empty structure and immutable evidence; review status controls formal consumption.
          properties:
            legacy:
              type: boolean
              enum: [false]
            generationTaskId:
              type: string
              minLength: 1
              description: Durable task that created this structured knowledge-point batch.
            title:
              $ref: "#/components/schemas/NonBlankText"
            shortSummary:
              $ref: "#/components/schemas/NonBlankText"
            definition:
              $ref: "#/components/schemas/NonBlankText"
            principles:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/NonBlankText"
            applicationScenarios:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/NonBlankText"
            pitfalls:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/NonBlankText"
            citations:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/SourceCitation"
    GeneratedKnowledgePointDraft:
      allOf:
        - $ref: "#/components/schemas/StructuredKnowledgePoint"
        - type: object
          properties:
            status:
              type: string
              enum: [DRAFT]
    QuestionGenerationEligibleKnowledgePoint:
      allOf:
        - $ref: "#/components/schemas/StructuredKnowledgePoint"
        - type: object
          description: >
            Persisted resource precondition for interview-question generation. Legacy, unconfirmed, outdated,
            or citation-invalid knowledge points fail with a stable 409 error code.
          properties:
            legacy:
              type: boolean
              enum: [false]
            status:
              type: string
              enum: [CONFIRMED]
            sourceOutdated:
              type: boolean
              enum: [false]
            citations:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/ActiveSourceCitation"
    LegacyKnowledgePoint:
      allOf:
        - $ref: "#/components/schemas/KnowledgePointBase"
        - type: object
          required: [name, description]
          description: >
            Migrated name/description knowledge point retained for compatibility. It has no fabricated
            structured fields and must be regenerated and reviewed to become structured learning content.
          properties:
            legacy:
              type: boolean
              enum: [true]
          not:
            anyOf:
              - required: [title]
              - required: [shortSummary]
              - required: [definition]
              - required: [principles]
              - required: [applicationScenarios]
              - required: [pitfalls]
              - required: [citations]
    KnowledgePointExtractionResult:
      type: object
      required: [taskId, task, knowledgePoints]
      properties:
        taskId:
          type: string
        task:
          $ref: "#/components/schemas/TaskStatus"
        knowledgePoints:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgePoint"
    UpdateKnowledgePointRequest:
      oneOf:
        - $ref: "#/components/schemas/StructuredKnowledgePointUpdate"
        - $ref: "#/components/schemas/LegacyKnowledgePointUpdate"
      description: >
        Partial edit for exactly one representation. Status transitions remain on confirm/reject endpoints;
        a request cannot mix structured fields with deprecated legacy name/description fields.
    StructuredKnowledgePointUpdate:
      type: object
      additionalProperties: false
      anyOf:
        - required: [title]
        - required: [shortSummary]
        - required: [definition]
        - required: [principles]
        - required: [applicationScenarios]
        - required: [pitfalls]
        - required: [citations]
      description: >
        Partial structured edit. Every supplied value is non-empty, and the resulting aggregate must still
        satisfy StructuredKnowledgePoint before it is returned or confirmed.
      properties:
        title:
          $ref: "#/components/schemas/NonBlankText"
        shortSummary:
          $ref: "#/components/schemas/NonBlankText"
        definition:
          $ref: "#/components/schemas/NonBlankText"
        principles:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NonBlankText"
        applicationScenarios:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NonBlankText"
        pitfalls:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NonBlankText"
        citations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceCitation"
    LegacyKnowledgePointUpdate:
      type: object
      deprecated: true
      additionalProperties: false
      anyOf:
        - required: [name]
        - required: [description]
      description: Deprecated partial edit retained for legacy name/description clients.
      properties:
        name:
          type: string
          minLength: 1
          deprecated: true
        description:
          type: string
          minLength: 1
          deprecated: true
    KnowledgePointReviewRequest:
      type: object
      properties:
        reviewComment:
          type: string
          maxLength: 1000
          description: Optional user review note; not sent to future generation as authoritative source text.
    GenerateKnowledgePointsRequest:
      type: object
      properties:
        revisionId:
          type: string
          description: Immutable source revision. Omit to use the material's current revision at submission time.
    KnowledgePointStatus:
      type: string
      enum: [DRAFT, CONFIRMED, REJECTED, ARCHIVED]
    GenerateQuestionRequest:
      type: object
      deprecated: true
      description: Deprecated generic single-question request retained for compatibility.
      required: [knowledgeBaseId, sourceRefs]
      properties:
        knowledgeBaseId:
          type: string
        sourceRefs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
        sourceType:
          $ref: "#/components/schemas/SourceType"
          deprecated: true
        sourceId:
          type: string
          deprecated: true
        questionType:
          $ref: "#/components/schemas/QuestionType"
        categoryId:
          type: string
          description: Optional category hint. The returned draft must still include its final category fields.
        categoryName:
          type: string
          description: Optional category name hint. The returned draft must still include its final category fields.
        knowledgePointIds:
          type: array
          description: Optional knowledge point hints. The returned draft must still include final knowledge point fields.
          items:
            type: string
        prompt:
          type: string
    GenerateKnowledgePointQuestionsRequest:
      type: object
      additionalProperties: false
      description: >
        Bounded generation settings. Omitting the body or all fields is the default one-click action:
        count=1, difficulty=MEDIUM, questionType=SHORT_ANSWER. The knowledgePointId is taken from the path;
        clients do not provide prompts, category ids, or source citations. count values above 10 are rejected
        with HTTP 400 to bound AI cost and the personal-stage review workload.
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        difficulty:
          allOf:
            - $ref: "#/components/schemas/QuestionDifficulty"
          default: MEDIUM
        questionType:
          allOf:
            - $ref: "#/components/schemas/QuestionType"
          default: SHORT_ANSWER
    GenerateExplanationRequest:
      type: object
      required: [knowledgeBaseId, knowledgePointId, sourceRefs]
      properties:
        knowledgeBaseId:
          type: string
        knowledgePointId:
          type: string
        sourceRefs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
        prompt:
          type: string
    GenerateReviewSuggestionRequest:
      type: object
      required: [knowledgeBaseId, sourceRefs]
      properties:
        knowledgeBaseId:
          type: string
        sourceRefs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
        weakKnowledgePointIds:
          type: array
          items:
            type: string
        wrongQuestionIds:
          type: array
          items:
            type: string
        prompt:
          type: string
    ReviewGeneratedContentRequest:
      oneOf:
        - $ref: "#/components/schemas/ReviewKnowledgePointQuestionDraftRequest"
        - $ref: "#/components/schemas/ReviewGenericGeneratedQuestionRequest"
      description: >
        The server selects the branch from the persisted generated-content kind. A client cannot relabel a
        knowledge-point interview draft as generic to modify locked attribution or evidence.
    ReviewKnowledgePointQuestionDraftRequest:
      type: object
      additionalProperties: false
      required: [contentKind, action]
      description: >
        Closed review shape for a knowledge-point interview draft. Only approved question content can change.
        knowledgePointId, knowledgePointIds, sourceRefs, citations, generationTaskId, and other attribution
        fields are deliberately absent and rejected. Changing difficulty causes the server to apply the fixed
        EASY=2, MEDIUM=3, HARD=4 persisted mapping.
      properties:
        contentKind:
          type: string
          enum: [KNOWLEDGE_POINT_INTERVIEW_QUESTION]
        action:
          $ref: "#/components/schemas/GeneratedContentReviewAction"
        stem:
          $ref: "#/components/schemas/NonBlankText"
        options:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/NonBlankText"
        answer:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NonBlankText"
        explanation:
          $ref: "#/components/schemas/NonBlankText"
        difficulty:
          $ref: "#/components/schemas/QuestionDifficulty"
        questionType:
          $ref: "#/components/schemas/QuestionType"
        categoryId:
          type: string
        categoryName:
          $ref: "#/components/schemas/NonBlankText"
    ReviewGenericGeneratedQuestionRequest:
      type: object
      deprecated: true
      additionalProperties: false
      required: [status]
      description: Deprecated compatibility review shape for existing non-knowledge-point generated questions.
      properties:
        status:
          $ref: "#/components/schemas/GeneratedContentReviewStatus"
        stem:
          $ref: "#/components/schemas/NonBlankText"
        options:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/NonBlankText"
        answer:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NonBlankText"
        explanation:
          $ref: "#/components/schemas/NonBlankText"
        difficulty:
          $ref: "#/components/schemas/QuestionDifficulty"
        categoryId:
          type: string
        categoryName:
          $ref: "#/components/schemas/NonBlankText"
        knowledgePointIds:
          type: array
          minItems: 1
          items:
            type: string
        sourceRefs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
    GeneratedQuestionDraft:
      oneOf:
        - $ref: "#/components/schemas/GenericGeneratedQuestionDraft"
        - $ref: "#/components/schemas/KnowledgePointQuestionDraft"
      description: Exactly one generic compatibility draft or knowledge-point interview-question draft.
    GeneratedQuestionDraftBase:
      type: object
      required: [id, knowledgeBaseId, generationTaskId, status, questionType, stem, answer, explanation, categoryId, categoryName]
      description: >
        Shared generated-question content and review lifecycle. AI output fields are trim-validated and reject
        whitespace-only or multiline-blank values before a draft is persisted. If any required generated text
        is blank after trimming, the generation task fails and no draft is created.
      properties:
        id:
          type: string
        knowledgeBaseId:
          type: string
        generationTaskId:
          type: string
          description: Persisted asynchronous generation task id.
        status:
          $ref: "#/components/schemas/GeneratedContentStatus"
        questionType:
          $ref: "#/components/schemas/QuestionType"
        stem:
          $ref: "#/components/schemas/NonBlankText"
        categoryId:
          type: string
        categoryName:
          $ref: "#/components/schemas/NonBlankText"
        difficulty:
          $ref: "#/components/schemas/QuestionDifficulty"
        options:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/NonBlankText"
        answer:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NonBlankText"
        explanation:
          $ref: "#/components/schemas/NonBlankText"
        savedQuestionId:
          type: string
          description: Present after the generated question is saved as a formal question.
        savedAt:
          type: string
          format: date-time
          description: Present after status becomes SAVED.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GenericGeneratedQuestionDraft:
      allOf:
        - $ref: "#/components/schemas/GeneratedQuestionDraftBase"
        - type: object
          required: [sourceRefs, knowledgePointIds]
          properties:
            sourceRefs:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/SourceRef"
            sourceType:
              $ref: "#/components/schemas/SourceType"
              deprecated: true
            sourceId:
              type: string
              deprecated: true
            knowledgePointIds:
              type: array
              items:
                type: string
          not:
            anyOf:
              - required: [knowledgePointId]
              - required: [citations]
              - required: [difficultyValue]
    KnowledgePointQuestionDraft:
      allOf:
        - $ref: "#/components/schemas/GeneratedQuestionDraftBase"
        - $ref: "#/components/schemas/QuestionDifficultyMapping"
        - type: object
          required: [knowledgePointId, citations]
          description: >
            Interview-question draft generated from one eligible structured knowledge point. Attribution and
            evidence are immutable through review; after SAVE the response keeps the same difficulty mapping and
            exposes savedQuestionId while the formal question uses knowledgePointIds=[knowledgePointId].
          properties:
            knowledgePointId:
              type: string
              minLength: 1
            citations:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/SourceCitation"
          not:
            anyOf:
              - required: [knowledgePointIds]
              - required: [sourceRefs]
              - required: [sourceType]
              - required: [sourceId]
    PendingReviewKnowledgePointQuestionDraft:
      allOf:
        - $ref: "#/components/schemas/KnowledgePointQuestionDraft"
        - type: object
          properties:
            status:
              type: string
              enum: [PENDING_REVIEW]
    AiNoteDraft:
      type: object
      required: [id, knowledgeBaseId, generationTaskId, type, title, content, sourceRefs, createdAt]
      properties:
        id:
          type: string
        knowledgeBaseId:
          type: string
        generationTaskId:
          type: string
          description: Persisted generation task id.
        type:
          $ref: "#/components/schemas/AiNoteType"
        title:
          type: string
        content:
          type: string
        sourceRefs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
        createdAt:
          type: string
          format: date-time
    SaveAiNoteRequest:
      type: object
      required: [knowledgeBaseId, type, title, content, sourceRefs]
      properties:
        draftId:
          type: string
        knowledgeBaseId:
          type: string
        type:
          $ref: "#/components/schemas/AiNoteType"
        title:
          type: string
        content:
          type: string
        sourceRefs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
    SavedAiNote:
      type: object
      required: [id, knowledgeBaseId, type, title, content, sourceRefs, savedAt]
      properties:
        id:
          type: string
        knowledgeBaseId:
          type: string
        type:
          $ref: "#/components/schemas/AiNoteType"
        title:
          type: string
        content:
          type: string
        sourceRefs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
        savedAt:
          type: string
          format: date-time
    SearchResult:
      type: object
      required: [id, type, title, summary, score]
      description: >
        Search result after explicit knowledgeBaseId/materialId scope filtering. Semantic
        results use server-side embedding similarity over material chunk embeddings; other
        result types may be matched by linked chunk/source metadata or keyword fallback.
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/SearchResultType"
        title:
          type: string
        summary:
          type: string
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Normalized relevance score after retrieval and fallback ranking.
        knowledgeBaseId:
          type: string
        knowledgePointIds:
          type: array
          items:
            type: string
        sourceRefs:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
    AskQuestionRequest:
      type: object
      required: [question]
      anyOf:
        - required: [knowledgeBaseId]
        - required: [materialId]
      description: >
        RAG asks are always scoped. Provide at least one of knowledgeBaseId or materialId; the API does
        not perform implicit global question answering. If both are provided, materialId must belong to
        knowledgeBaseId and retrieval is narrowed to that material.
      properties:
        knowledgeBaseId:
          type: string
          description: Required unless materialId is provided.
        materialId:
          type: string
          description: Required unless knowledgeBaseId is provided.
        question:
          type: string
    RagAnswer:
      type: object
      required: [answer, uncertain, citations]
      description: >
        RAG answer constrained to the requested knowledge base or material. When evidence is
        insufficient, uncertain must be true and answer should explicitly say the material
        does not contain enough basis instead of inventing a definitive answer.
      properties:
        answer:
          type: string
        uncertain:
          type: boolean
        uncertaintyReason:
          type: string
          description: Short user-safe reason when uncertain is true, such as INSUFFICIENT_EVIDENCE.
        citations:
          type: array
          description: Source references for chunks actually used in the answer. May be empty only when uncertain is true.
          items:
            $ref: "#/components/schemas/SourceRef"
        evidenceChunks:
          type: array
          items:
            $ref: "#/components/schemas/MaterialChunk"
        savedAiNoteId:
          type: string
        statements:
          type: array
          description: >
            Answer decomposed into individual statements, each carrying the citation indices
            (into the citations array) that support it. Empty when the answer is not decomposed.
          items:
            $ref: "#/components/schemas/RagStatement"
    RagStatement:
      type: object
      required: [text, citations]
      description: A single answer statement paired with the citation indices that back it.
      properties:
        text:
          type: string
        citations:
          type: array
          description: Zero-based indices into the RagAnswer.citations array supporting this statement.
          items:
            type: integer
    MaterialSourceType:
      type: string
      enum: [MARKDOWN, TXT, PDF, DOC, DOCX]
    LegacyMaterialSourceType:
      type: string
      deprecated: true
      enum: [MARKDOWN, TXT, PDF]
      description: Deprecated text-import source hint. DOC/DOCX require the multipart original-file path.
    MaterialStatus:
      type: string
      enum: [UPLOADED, PROCESSING, READY, FAILED, DELETED, PARSING, CHUNKING, INDEXING]
      description: >
        New asynchronous flows expose UPLOADED, PROCESSING, READY, FAILED, or DELETED. PARSING, CHUNKING,
        and INDEXING are deprecated compatibility values; detailed execution belongs in TaskStatus.currentStep.
    EmbeddingStatus:
      type: string
      enum: [PENDING, INDEXING, READY, FAILED, INVALIDATED]
      description: >
        Server-side embedding lifecycle for material chunks. INVALIDATED means the source
        material was deleted or the embedding model changed and the vector must not be used.
    DeletedMaterialSavedContentPolicy:
      type: string
      enum: [KEEP_SAVED_CONTENT, DELETE_SAVED_CONTENT]
      default: KEEP_SAVED_CONTENT
      description: >
        KEEP_SAVED_CONTENT retains already saved questions and AI notes, marking their material SourceRef
        objects as deleted. DELETE_SAVED_CONTENT removes saved content derived solely from the deleted
        material; mixed-source content should be retained with only the deleted source marked.
    DeletedMaterialPendingContentPolicy:
      type: string
      enum: [DELETE_PENDING_GENERATED_CONTENT, KEEP_PENDING_GENERATED_CONTENT]
      default: DELETE_PENDING_GENERATED_CONTENT
      description: >
        DELETE_PENDING_GENERATED_CONTENT marks pending generated drafts sourced from the deleted material
        as DELETED. KEEP_PENDING_GENERATED_CONTENT keeps drafts reviewable, but their material SourceRef
        objects must have deleted=true.
    GeneratedContentStatus:
      type: string
      enum: [PENDING_REVIEW, SAVED, DISCARDED, DELETED]
      description: >
        PENDING_REVIEW drafts await user confirmation. SAVED drafts have been converted to formal saved
        content. DISCARDED is an explicit user rejection. DELETED is a soft-deleted generated item,
        including pending drafts removed because their source material was deleted.
    GeneratedContentReviewStatus:
      type: string
      enum: [SAVED, DISCARDED]
      description: Explicit user review action for a PENDING_REVIEW generated draft.
    GeneratedContentReviewAction:
      type: string
      enum: [SAVE, DISCARD]
      description: Closed review action for knowledge-point interview-question drafts.
    AiNoteType:
      type: string
      enum: [KNOWLEDGE_POINT_EXPLANATION, REVIEW_SUGGESTION, RAG_ANSWER, MANUAL_NOTE]
    AiProviderStatus:
      type: object
      required: [providerType, configured, available]
      description: Sanitized provider status for clients and diagnostics. Secrets are never exposed.
      properties:
        providerType:
          $ref: "#/components/schemas/AiProviderType"
        configured:
          type: boolean
          description: True when required non-secret fields and secret references are configured.
        available:
          type: boolean
          description: False when provider configuration is missing or the adapter is disabled/unreachable.
        baseUrl:
          type: string
          description: Non-secret OpenAI-compatible base URL; omit if it should not be displayed.
        chatModel:
          type: string
        embeddingModel:
          type: string
        embeddingDimensions:
          type: integer
        apiKeyEnvName:
          type: string
          description: Environment variable name used for the key, for example SUILEARN_AI_API_KEY. Never return the key value.
        timeoutMs:
          type: integer
        maxRetries:
          type: integer
        message:
          type: string
          description: User-safe availability or configuration summary.
    AiProviderType:
      type: string
      enum: [FAKE, OPENAI_COMPATIBLE]
    SourceType:
      type: string
      enum: [KNOWLEDGE_POINT, WRONG_QUESTION, MATERIAL, MATERIAL_CHUNK, KNOWLEDGE_BASE, ANSWER_HISTORY]
    SourceRef:
      type: object
      required: [type, id]
      description: >
        Traceability pointer for generated and saved content. If the referenced material or chunk is
        soft-deleted after content is saved, keep the SourceRef for auditability and set deleted=true.
      properties:
        type:
          $ref: "#/components/schemas/SourceType"
        id:
          type: string
        knowledgeBaseId:
          type: string
        title:
          type: string
        materialId:
          type: string
        chunkId:
          type: string
        deleted:
          type: boolean
          description: True when the referenced source, such as a material or material chunk, has been soft deleted and must no longer be used for new search, RAG, or generation.
        excerpt:
          type: string
    SourceCitation:
      type: object
      required: [materialId, revisionId, excerpt]
      anyOf:
        - required: [pageNumber]
        - required: [blockId]
      description: >
        Immutable evidence pointer used by structured knowledge points and generated interview questions.
        revisionId never follows the material's current revision automatically. At least pageNumber or blockId
        is required so clients can navigate to a precise reading position.
      properties:
        materialId:
          type: string
          minLength: 1
        revisionId:
          type: string
          minLength: 1
        pageNumber:
          type: integer
          minimum: 1
        blockId:
          type: string
          minLength: 1
        excerpt:
          $ref: "#/components/schemas/NonBlankText"
        deleted:
          type: boolean
          description: True when the source material was later soft-deleted; the citation remains for auditability.
    ActiveSourceCitation:
      allOf:
        - $ref: "#/components/schemas/SourceCitation"
        - type: object
          required: [deleted]
          description: Current immutable evidence eligible for new generation; deleted sources are never eligible.
          properties:
            deleted:
              type: boolean
              enum: [false]
    QuestionType:
      type: string
      enum: [SINGLE_CHOICE, MULTIPLE_CHOICE, TRUE_FALSE, SHORT_ANSWER]
    QuestionDifficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]
      description: Generated difficulty level. Persisted formal mapping is EASY=2, MEDIUM=3, HARD=4.
    QuestionDifficultyMapping:
      type: object
      required: [difficulty, difficultyValue]
      properties:
        difficulty:
          $ref: "#/components/schemas/QuestionDifficulty"
        difficultyValue:
          type: integer
          enum: [2, 3, 4]
          description: Deterministic formal value; clients do not calculate it.
      oneOf:
        - properties:
            difficulty:
              type: string
              enum: [EASY]
            difficultyValue:
              type: integer
              enum: [2]
        - properties:
            difficulty:
              type: string
              enum: [MEDIUM]
            difficultyValue:
              type: integer
              enum: [3]
        - properties:
            difficulty:
              type: string
              enum: [HARD]
            difficultyValue:
              type: integer
              enum: [4]
    FormalQuestionDifficultyMapping:
      type: object
      required: [difficulty, difficultyLevel]
      oneOf:
        - properties:
            difficulty:
              type: integer
              enum: [2]
            difficultyLevel:
              type: string
              enum: [EASY]
        - properties:
            difficulty:
              type: integer
              enum: [3]
            difficultyLevel:
              type: string
              enum: [MEDIUM]
        - properties:
            difficulty:
              type: integer
              enum: [4]
            difficultyLevel:
              type: string
              enum: [HARD]
    SearchResultType:
      type: string
      enum: [QUESTION, KNOWLEDGE_POINT, MATERIAL_CHUNK, GENERATED_CONTENT]
    TaskStatus:
      oneOf:
        - $ref: "#/components/schemas/QueuedTaskStatus"
        - $ref: "#/components/schemas/RunningTaskStatus"
        - $ref: "#/components/schemas/RetryWaitTaskStatus"
        - $ref: "#/components/schemas/SucceededTaskStatus"
        - $ref: "#/components/schemas/FailedTaskStatus"
        - $ref: "#/components/schemas/CancelledTaskStatus"
      discriminator:
        propertyName: status
        mapping:
          QUEUED: "#/components/schemas/QueuedTaskStatus"
          RUNNING: "#/components/schemas/RunningTaskStatus"
          RETRY_WAIT: "#/components/schemas/RetryWaitTaskStatus"
          SUCCEEDED: "#/components/schemas/SucceededTaskStatus"
          FAILED: "#/components/schemas/FailedTaskStatus"
          CANCELLED: "#/components/schemas/CancelledTaskStatus"
      description: Exactly one lifecycle-specific persisted asynchronous task state.
    TaskStatusBase:
      type: object
      required: [id, kind, status, currentStep, progress, attempt, maxAttempts, correlationId, processingVersion, createdAt, updatedAt]
      description: >
        Persisted asynchronous status for document processing, embedding, knowledge-point generation, and
        question generation. It exposes only user-safe progress, sanitized errors, and API resource references;
        internal exchange/queue names, object keys, credentials, and raw adapter/model responses are forbidden.
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/TaskKind"
        status:
          $ref: "#/components/schemas/TaskLifecycleStatus"
        knowledgeBaseId:
          type: string
        materialId:
          type: string
        generatedContentId:
          type: string
          deprecated: true
          description: Deprecated singular result shortcut. Use resultRefs for batches.
        providerType:
          $ref: "#/components/schemas/AiProviderType"
        model:
          type: string
          description: Chat or embedding model used by this task; never contains secrets.
        progressPercent:
          type: integer
          deprecated: true
          description: Deprecated compatibility shortcut for progress.percent.
          minimum: 0
          maximum: 100
        currentStep:
          $ref: "#/components/schemas/TaskCurrentStep"
        progress:
          $ref: "#/components/schemas/TaskProgress"
        attempt:
          type: integer
          minimum: 0
          description: Current persisted task attempt; 0 while queued before the first claim.
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 3
        nextRetryAt:
          type: string
          format: date-time
          description: Present only while status is RETRY_WAIT.
        correlationId:
          type: string
          description: Stable opaque correlation id retained across retries and process restarts.
        processingVersion:
          type: string
          description: Sanitized logical processing/generation version used to relate idempotent results.
        errorCode:
          allOf:
            - $ref: "#/components/schemas/NonBlankText"
          description: Stable sanitized error classification; never an internal queue or storage identifier.
        errorMessage:
          allOf:
            - $ref: "#/components/schemas/NonBlankText"
          description: User-safe sanitized error summary; never raw adapter/model output, body text, or secrets.
        retryCount:
          type: integer
          deprecated: true
          description: Deprecated compatibility counter. Use attempt and maxAttempts.
        resultRef:
          $ref: "#/components/schemas/TaskResultRef"
          deprecated: true
        resultRefs:
          type: array
          description: API-addressable material, revision, knowledge-point batch, or question-draft batch results.
          items:
            $ref: "#/components/schemas/TaskResultRef"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    QueuedTaskStatus:
      allOf:
        - $ref: "#/components/schemas/TaskStatusBase"
        - type: object
          properties:
            status:
              type: string
              enum: [QUEUED]
          not:
            anyOf:
              - required: [startedAt]
              - required: [finishedAt]
              - required: [nextRetryAt]
              - required: [errorCode]
              - required: [errorMessage]
              - required: [resultRef]
              - required: [resultRefs]
              - required: [generatedContentId]
    RunningTaskStatus:
      allOf:
        - $ref: "#/components/schemas/TaskStatusBase"
        - type: object
          required: [startedAt]
          properties:
            status:
              type: string
              enum: [RUNNING]
          not:
            anyOf:
              - required: [finishedAt]
              - required: [nextRetryAt]
              - required: [errorCode]
              - required: [errorMessage]
              - required: [resultRef]
              - required: [resultRefs]
              - required: [generatedContentId]
    RetryWaitTaskStatus:
      allOf:
        - $ref: "#/components/schemas/TaskStatusBase"
        - type: object
          required: [startedAt, nextRetryAt, errorCode, errorMessage]
          properties:
            status:
              type: string
              enum: [RETRY_WAIT]
          not:
            anyOf:
              - required: [finishedAt]
              - required: [resultRef]
              - required: [resultRefs]
              - required: [generatedContentId]
    SucceededTaskStatus:
      allOf:
        - $ref: "#/components/schemas/TaskStatusBase"
        - type: object
          required: [startedAt, finishedAt, resultRefs]
          properties:
            status:
              type: string
              enum: [SUCCEEDED]
            progress:
              allOf:
                - $ref: "#/components/schemas/TaskProgress"
                - type: object
                  properties:
                    percent:
                      type: integer
                      enum: [100]
            progressPercent:
              type: integer
              enum: [100]
              deprecated: true
              description: Deprecated compatibility shortcut fixed to 100 for a succeeded task.
            resultRefs:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/TaskResultRef"
          not:
            anyOf:
              - required: [nextRetryAt]
              - required: [errorCode]
              - required: [errorMessage]
    FailedTaskStatus:
      allOf:
        - $ref: "#/components/schemas/TaskStatusBase"
        - type: object
          required: [startedAt, finishedAt, errorCode, errorMessage]
          properties:
            status:
              type: string
              enum: [FAILED]
          not:
            anyOf:
              - required: [nextRetryAt]
              - required: [resultRef]
              - required: [resultRefs]
              - required: [generatedContentId]
    CancelledTaskStatus:
      allOf:
        - $ref: "#/components/schemas/TaskStatusBase"
        - type: object
          required: [finishedAt]
          properties:
            status:
              type: string
              enum: [CANCELLED]
          not:
            anyOf:
              - required: [nextRetryAt]
              - required: [errorCode]
              - required: [errorMessage]
              - required: [resultRef]
              - required: [resultRefs]
              - required: [generatedContentId]
    TaskResultRef:
      type: object
      required: [type, href]
      description: >
        User-safe result pointer. href is an API resource path; it is never a MinIO object key, queue name,
        credential-bearing URL, or model response reference.
      properties:
        type:
          $ref: "#/components/schemas/TaskResultType"
        id:
          type: string
        href:
          type: string
        materialId:
          type: string
        revisionId:
          type: string
        count:
          type: integer
          minimum: 0
      oneOf:
        - title: Knowledge-point generation batch
          required: [count]
          properties:
            type:
              type: string
              enum: [KNOWLEDGE_POINT_BATCH]
            href:
              type: string
              pattern: '^/api/v2/tasks/[^/]+/knowledge-points$'
        - title: Question-draft generation batch
          required: [count]
          properties:
            type:
              type: string
              enum: [QUESTION_DRAFT_BATCH]
            href:
              type: string
              pattern: '^/api/v2/tasks/[^/]+/question-drafts$'
        - title: Compatible non-batch result
          properties:
            type:
              type: string
              enum: [MATERIAL, DOCUMENT_REVISION, MATERIAL_CHUNKS, GENERATED_CONTENT, AI_NOTE_DRAFT, KNOWLEDGE_POINTS]
    TaskResultType:
      type: string
      enum: [MATERIAL, DOCUMENT_REVISION, MATERIAL_CHUNKS, GENERATED_CONTENT, AI_NOTE_DRAFT, KNOWLEDGE_POINTS, KNOWLEDGE_POINT_BATCH, QUESTION_DRAFT_BATCH]
    TaskSubmission:
      type: object
      required: [taskId, status, taskHref]
      description: Durable asynchronous task submission returned with HTTP 202.
      properties:
        taskId:
          type: string
        status:
          $ref: "#/components/schemas/TaskLifecycleStatus"
        taskHref:
          type: string
          description: Relative API href, normally /api/v2/tasks/{taskId}.
    MaterialTaskSubmission:
      allOf:
        - $ref: "#/components/schemas/TaskSubmission"
        - type: object
          required: [materialId, materialHref]
          properties:
            materialId:
              type: string
            materialHref:
              type: string
              description: Relative API href for material processing state and asset availability.
    TaskKind:
      type: string
      enum: [MATERIAL_IMPORT, MATERIAL_REPROCESS, EMBEDDING, QUESTION_GENERATION, KNOWLEDGE_POINT_GENERATION, KNOWLEDGE_POINT_EXTRACTION, KNOWLEDGE_POINT_QUESTION_GENERATION, EXPLANATION_GENERATION, REVIEW_SUGGESTION_GENERATION]
    TaskLifecycleStatus:
      type: string
      enum: [QUEUED, RUNNING, RETRY_WAIT, SUCCEEDED, FAILED, CANCELLED]
    TaskCurrentStep:
      type: string
      enum: [QUEUED, VALIDATING, STORING_ORIGINAL, PARSING, OCR, NORMALIZING, CHUNKING, INDEXING, EMBEDDING, GENERATING_KNOWLEDGE_POINTS, GENERATING_QUESTIONS, GENERATING_EXPLANATION, GENERATING_REVIEW_SUGGESTION, FINALIZING, COMPLETED]
    TaskProgress:
      type: object
      required: [percent]
      properties:
        percent:
          type: integer
          minimum: 0
          maximum: 100
        completedUnits:
          type: integer
          minimum: 0
        totalUnits:
          type: integer
          minimum: 0
        message:
          type: string
          description: Optional localized or user-safe progress message; never source body or raw adapter output.
