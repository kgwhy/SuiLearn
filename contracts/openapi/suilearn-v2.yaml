openapi: 3.0.3
info:
  title: SuiLearn V2 API
  version: 0.1.0
  description: API contract for Java backend AI/RAG and the React Web knowledge base workbench.
servers:
  - url: http://localhost:8080
paths:
  /api/v2/knowledge-bases:
    get:
      summary: List knowledge bases
      responses:
        "200":
          description: Knowledge base list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeBase"
    post:
      summary: Create a knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeBaseRequest"
      responses:
        "200":
          description: Created knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
  /api/v2/knowledge-bases/{knowledgeBaseId}:
    get:
      summary: Get knowledge base detail
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      responses:
        "200":
          description: Knowledge base detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseDetail"
    patch:
      summary: Rename a knowledge base
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameKnowledgeBaseRequest"
      responses:
        "200":
          description: Updated knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
    delete:
      summary: Delete a knowledge base
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      responses:
        "204":
          description: Deleted
  /api/v2/knowledge-bases/{knowledgeBaseId}/questions:
    get:
      summary: List questions saved in a knowledge base
      description: Lightweight workbench view for knowledge base detail. Full Web practice flow belongs to the next phase.
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      responses:
        "200":
          description: Question summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionSummary"
  /api/v2/knowledge-bases/{knowledgeBaseId}/statistics:
    get:
      summary: Get lightweight learning statistics for a knowledge base
      description: Supports the second-version Web workbench detail page without introducing the full Web learning flow.
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      responses:
        "200":
          description: Knowledge base statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseStatistics"
  /api/v2/knowledge-bases/{knowledgeBaseId}/materials:
    get:
      summary: List materials in a knowledge base
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      responses:
        "200":
          description: Material list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningMaterial"
    post:
      summary: Import Markdown, TXT, or PDF material
      description: >
        Imports material into the knowledge base. MVP implementations accept normalized text content plus
        title, fileName, and sourceType. multipart/form-data is reserved as the cross-client upload shape,
        but the MVP must not claim that raw PDF binary parsing is available; PDF binary parsing is a later
        document-parser adapter concern. When sourceType is PDF during MVP, content is the already textified
        PDF content supplied by the client or another upstream extractor.
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportMaterialRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadMaterialFormData"
      responses:
        "200":
          description: Imported material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningMaterial"
  /api/v2/materials/{materialId}:
    get:
      summary: Get material detail
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "200":
          description: Material detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetail"
    delete:
      summary: Delete material
      description: Soft deletes the material, removes it from future RAG/search/generation, invalidates chunks and embeddings, deletes pending generated content by default, and keeps already saved questions or AI notes with deleted-source SourceRef metadata.
      parameters:
        - $ref: "#/components/parameters/MaterialId"
        - in: query
          name: savedContentPolicy
          schema:
            $ref: "#/components/schemas/DeletedMaterialSavedContentPolicy"
          description: Policy for questions or AI notes already saved from this material. Default is KEEP_SAVED_CONTENT.
        - in: query
          name: pendingContentPolicy
          schema:
            $ref: "#/components/schemas/DeletedMaterialPendingContentPolicy"
          description: Policy for pending generated drafts sourced from this material. Default is DELETE_PENDING_GENERATED_CONTENT.
      responses:
        "200":
          description: Material deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDeletionResult"
  /api/v2/materials/{materialId}/extract-knowledge-points:
    post:
      summary: Extract editable knowledge points from material
      description: >
        Creates a persisted generation task even when the MVP executes synchronously.
        The returned task id can be queried through /api/v2/tasks/{taskId}.
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "200":
          description: Extracted knowledge points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePointExtractionResult"
  /api/v2/knowledge-bases/{knowledgeBaseId}/knowledge-points:
    get:
      summary: List extracted or generated knowledge points
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseId"
      responses:
        "200":
          description: Knowledge point list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgePoint"
  /api/v2/knowledge-points/{knowledgePointId}:
    patch:
      summary: Edit extracted knowledge point
      parameters:
        - $ref: "#/components/parameters/KnowledgePointId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKnowledgePointRequest"
      responses:
        "200":
          description: Updated knowledge point
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePoint"
    delete:
      summary: Delete extracted knowledge point
      parameters:
        - $ref: "#/components/parameters/KnowledgePointId"
      responses:
        "204":
          description: Deleted
  /api/v2/ai/generated-questions:
    post:
      summary: Generate question draft from source
      description: >
        Creates a persisted generation task. MVP implementations may execute synchronously,
        but must still write a SUCCEEDED or FAILED task row before returning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateQuestionRequest"
      responses:
        "200":
          description: Pending review question draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedQuestionDraft"
  /api/v2/ai/knowledge-point-explanations:
    post:
      summary: Generate a knowledge point explanation
      description: >
        Creates a persisted generation task. The response must not contain provider raw
        output or secrets; only the reviewed draft shape is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateExplanationRequest"
      responses:
        "200":
          description: Explanation draft that can be saved as an AI note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiNoteDraft"
  /api/v2/ai/review-suggestions:
    post:
      summary: Generate review suggestions from answer history, weak knowledge points, or wrong questions
      description: >
        Creates a persisted generation task. The task records provider type/model metadata
        and error summaries, never API keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateReviewSuggestionRequest"
      responses:
        "200":
          description: Review suggestion draft that can be saved as an AI note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiNoteDraft"
  /api/v2/ai/notes:
    post:
      summary: Save an AI explanation, review suggestion, or RAG answer as a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAiNoteRequest"
      responses:
        "200":
          description: Saved AI note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedAiNote"
  /api/v2/ai/generated-contents:
    get:
      summary: List generated contents
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/GeneratedContentStatus"
      responses:
        "200":
          description: Generated contents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedQuestionDraft"
  /api/v2/ai/generated-contents/{generatedContentId}:
    patch:
      summary: Save, edit, or discard generated content
      parameters:
        - $ref: "#/components/parameters/GeneratedContentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewGeneratedContentRequest"
      responses:
        "200":
          description: Updated generated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedQuestionDraft"
    delete:
      summary: Soft delete generated content
      parameters:
        - $ref: "#/components/parameters/GeneratedContentId"
      responses:
        "204":
          description: Deleted
  /api/v2/ai/provider-status:
    get:
      summary: Get sanitized AI provider runtime status
      description: >
        Returns non-secret provider configuration needed by clients to decide whether AI
        features are available. The response must never include API keys, raw authorization
        headers, or provider secret values.
      responses:
        "200":
          description: Sanitized AI provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderStatus"
  /api/v2/search:
    get:
      summary: Semantic search across questions, knowledge points, material chunks, and generated content
      description: >
        Search is always scoped. Clients must provide at least one of knowledgeBaseId or materialId.
        The API does not perform implicit global search. If both are provided, materialId must belong to
        knowledgeBaseId and the search is narrowed to that material.
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
        - in: query
          name: knowledgeBaseId
          schema:
            type: string
          description: Required unless materialId is provided. Limits search to one knowledge base.
        - in: query
          name: materialId
          schema:
            type: string
          description: Required unless knowledgeBaseId is provided. Limits search to one material.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Maximum results to return after scope filtering.
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
  /api/v2/rag/ask:
    post:
      summary: Ask a question within a knowledge base or material scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskQuestionRequest"
      responses:
        "200":
          description: RAG answer with citations and uncertainty flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagAnswer"
  /api/v2/tasks/{taskId}:
    get:
      summary: Get generation, material import, or embedding task status
      description: >
        Unified task status endpoint. MVP implementations may execute work synchronously,
        but every material import, embedding, and AI generation flow must persist a task
        row and expose its final status here.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatus"
components:
  parameters:
    KnowledgeBaseId:
      in: path
      name: knowledgeBaseId
      required: true
      schema:
        type: string
    MaterialId:
      in: path
      name: materialId
      required: true
      schema:
        type: string
    GeneratedContentId:
      in: path
      name: generatedContentId
      required: true
      schema:
        type: string
    KnowledgePointId:
      in: path
      name: knowledgePointId
      required: true
      schema:
        type: string
    TaskId:
      in: path
      name: taskId
      required: true
      schema:
        type: string
  schemas:
    CreateKnowledgeBaseRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    RenameKnowledgeBaseRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    KnowledgeBase:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    KnowledgeBaseDetail:
      allOf:
        - $ref: "#/components/schemas/KnowledgeBase"
        - type: object
          description: >
            Lightweight detail counters. Counts are computed from persisted rows in the
            knowledge base and must not be placeholder constants.
          properties:
            materialCount:
              type: integer
              description: Non-deleted materials in this knowledge base.
            knowledgePointCount:
              type: integer
              description: Non-deleted extracted or generated knowledge points in this knowledge base.
            questionCount:
              type: integer
              description: Saved formal questions in this knowledge base, including saved AI-generated questions.
            generatedContentCount:
              type: integer
              description: Generated contents not soft-deleted, including pending review, saved, and discarded items.
            aiNoteCount:
              type: integer
              description: Saved AI notes in this knowledge base.
    QuestionSummary:
      type: object
      required: [id, knowledgeBaseId, questionType, stem, categoryId, categoryName, knowledgePointIds, createdAt, sourceRefs]
      description: Saved formal question summary. Saved AI-generated questions must retain formal category and knowledge point attribution from the reviewed draft.
      properties:
        id:
          type: string
        knowledgeBaseId:
          type: string
        questionType:
          $ref: "#/components/schemas/QuestionType"
        stem:
          type: string
        categoryId:
          type: string
        categoryName:
          type: string
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
        knowledgePointIds:
          type: array
          items:
            type: string
        answeredCount:
          type: integer
        correctRate:
          type: number
          format: double
        sourceRefs:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
        createdAt:
          type: string
          format: date-time
        savedAt:
          type: string
          format: date-time
    KnowledgeBaseStatistics:
      type: object
      required: [knowledgeBaseId, questionCount, answeredQuestionCount, answerCount, wrongQuestionCount]
      description: >
        Lightweight learning statistics for the knowledge base detail page. Values must be
        derived from saved questions and answer records; if no answer records exist, counts
        are zero and correctRate is omitted or null rather than filled with a placeholder.
      properties:
        knowledgeBaseId:
          type: string
        questionCount:
          type: integer
          description: Saved formal questions in the knowledge base.
        answeredQuestionCount:
          type: integer
          description: Distinct saved questions with at least one answer record.
        answerCount:
          type: integer
          description: Total answer attempts recorded for saved questions in the knowledge base.
        correctRate:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
          description: Correct answers divided by answerCount; null or omitted when answerCount is 0.
        wrongQuestionCount:
          type: integer
          description: Saved questions that currently have at least one unmastered wrong-question record.
        weakKnowledgePointIds:
          type: array
          description: Knowledge point ids ranked as weak by wrong-question or low-correct-rate evidence; empty when there is no evidence.
          items:
            type: string
    ImportMaterialRequest:
      type: object
      required: [title, sourceType, content]
      description: >
        JSON import shape for MVP. content is normalized plain text or Markdown content, even when
        sourceType is PDF. Raw PDF binary parsing is intentionally not promised by this contract version.
      properties:
        title:
          type: string
        fileName:
          type: string
          description: Original client-side file name when the material came from a file.
        sourceType:
          $ref: "#/components/schemas/MaterialSourceType"
        content:
          type: string
          description: Textified material content used for chunking, embedding, search, and RAG in the MVP.
    UploadMaterialFormData:
      type: object
      required: [title, sourceType, content]
      description: >
        multipart/form-data shape kept for Web/Android upload compatibility. The MVP server consumes
        title, sourceType, fileName, and textified content. The optional file part may be sent for future
        compatibility, but raw PDF binary parsing is not part of the MVP behavior until a parser adapter
        is wired in.
      properties:
        title:
          type: string
        fileName:
          type: string
          description: Original file name to display and keep for traceability.
        sourceType:
          $ref: "#/components/schemas/MaterialSourceType"
        content:
          type: string
          description: Textified Markdown, TXT, or PDF content consumed by the MVP.
        file:
          type: string
          format: binary
          description: Optional original file part retained for client compatibility; MVP behavior must not depend on parsing PDF binary content.
    LearningMaterial:
      type: object
      required: [id, knowledgeBaseId, title, sourceType, status, importTaskId, createdAt]
      description: Material list item. It intentionally excludes original content; call material detail for content or chunk data.
      properties:
        id:
          type: string
        knowledgeBaseId:
          type: string
        title:
          type: string
        sourceType:
          $ref: "#/components/schemas/MaterialSourceType"
        status:
          $ref: "#/components/schemas/MaterialStatus"
        importTaskId:
          type: string
          description: Material import task id. Present even when import completed synchronously.
        embeddingTaskId:
          type: string
          description: Embedding task id once chunk embedding has started or completed.
        errorMessage:
          type: string
          description: Short user-safe failure summary when status is FAILED.
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
    MaterialDetail:
      allOf:
        - $ref: "#/components/schemas/LearningMaterial"
        - type: object
          description: Material detail may include the normalized source content used by the MVP and derived chunks.
          properties:
            content:
              type: string
              description: Full normalized text content when the caller is allowed to inspect the material body.
            contentPreview:
              type: string
              description: Short preview for clients that do not need or cannot fetch full content.
            chunks:
              type: array
              items:
                $ref: "#/components/schemas/MaterialChunk"
            extractedKnowledgePoints:
              type: array
              items:
                $ref: "#/components/schemas/KnowledgePoint"
    MaterialChunk:
      type: object
      required: [id, knowledgeBaseId, materialId, content, ordinal, embeddingStatus]
      description: >
        Smallest retrievable unit for semantic search and RAG. The embedding vector itself
        is stored server-side in pgvector and is not returned by the API.
      properties:
        id:
          type: string
        knowledgeBaseId:
          type: string
        materialId:
          type: string
        content:
          type: string
        ordinal:
          type: integer
        titlePath:
          type: array
          items:
            type: string
          description: Heading path or structural labels used to help users locate the chunk.
        tokenEstimate:
          type: integer
          description: Approximate token count used by retrieval and prompt budgeting.
        embeddingStatus:
          $ref: "#/components/schemas/EmbeddingStatus"
        embeddingModel:
          type: string
          description: Embedding model used for the stored pgvector value; never an API key or secret.
        embeddingDimensions:
          type: integer
          description: Dimension count of the stored vector, used for migration and compatibility checks.
        sourceRef:
          $ref: "#/components/schemas/SourceRef"
    MaterialDeletionResult:
      type: object
      required: [materialId, status, savedContentPolicy, pendingContentPolicy, invalidatedChunkCount, deletedPendingGeneratedContentCount]
      description: >
        Result of soft-deleting a material. Deleted materials are excluded from future search, RAG, and
        generation. Pending generated drafts sourced from the material are deleted by default. Already
        saved questions and AI notes are kept by default, with their SourceRef.deleted flag set to true.
      properties:
        materialId:
          type: string
        status:
          $ref: "#/components/schemas/MaterialStatus"
        savedContentPolicy:
          $ref: "#/components/schemas/DeletedMaterialSavedContentPolicy"
        pendingContentPolicy:
          $ref: "#/components/schemas/DeletedMaterialPendingContentPolicy"
        invalidatedChunkCount:
          type: integer
        deletedPendingGeneratedContentCount:
          type: integer
        retainedSavedQuestionCount:
          type: integer
        retainedAiNoteCount:
          type: integer
        deletedAt:
          type: string
          format: date-time
    KnowledgePoint:
      type: object
      required: [id, knowledgeBaseId, name, description]
      properties:
        id:
          type: string
        knowledgeBaseId:
          type: string
        name:
          type: string
        description:
          type: string
        sourceMaterialId:
          type: string
          deprecated: true
        sourceRefs:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
    KnowledgePointExtractionResult:
      type: object
      required: [taskId, task, knowledgePoints]
      properties:
        taskId:
          type: string
        task:
          $ref: "#/components/schemas/TaskStatus"
        knowledgePoints:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgePoint"
    UpdateKnowledgePointRequest:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string
    GenerateQuestionRequest:
      type: object
      required: [knowledgeBaseId, sourceRefs]
      properties:
        knowledgeBaseId:
          type: string
        sourceRefs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
        sourceType:
          $ref: "#/components/schemas/SourceType"
          deprecated: true
        sourceId:
          type: string
          deprecated: true
        questionType:
          $ref: "#/components/schemas/QuestionType"
        categoryId:
          type: string
          description: Optional category hint. The returned draft must still include its final category fields.
        categoryName:
          type: string
          description: Optional category name hint. The returned draft must still include its final category fields.
        knowledgePointIds:
          type: array
          description: Optional knowledge point hints. The returned draft must still include final knowledge point fields.
          items:
            type: string
        prompt:
          type: string
    GenerateExplanationRequest:
      type: object
      required: [knowledgeBaseId, knowledgePointId, sourceRefs]
      properties:
        knowledgeBaseId:
          type: string
        knowledgePointId:
          type: string
        sourceRefs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
        prompt:
          type: string
    GenerateReviewSuggestionRequest:
      type: object
      required: [knowledgeBaseId, sourceRefs]
      properties:
        knowledgeBaseId:
          type: string
        sourceRefs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
        weakKnowledgePointIds:
          type: array
          items:
            type: string
        wrongQuestionIds:
          type: array
          items:
            type: string
        prompt:
          type: string
    ReviewGeneratedContentRequest:
      type: object
      required: [status]
      description: >
        Review action for generated content. When saving a generated question, clients may edit the
        formal classification fields; the saved question must retain categoryId/categoryName and
        knowledgePointIds.
      properties:
        status:
          $ref: "#/components/schemas/GeneratedContentStatus"
        stem:
          type: string
        options:
          type: array
          items:
            type: string
        answer:
          type: array
          items:
            type: string
        explanation:
          type: string
        categoryId:
          type: string
        categoryName:
          type: string
        knowledgePointIds:
          type: array
          items:
            type: string
        sourceRefs:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
    GeneratedQuestionDraft:
      type: object
      required: [id, knowledgeBaseId, generationTaskId, status, sourceRefs, questionType, stem, answer, explanation, categoryId, categoryName, knowledgePointIds]
      description: >
        Pending or reviewed AI-generated question. Drafts must carry the same formal classification
        fields that saved questions use, so review and save flows do not lose category or knowledge point
        attribution. If the source material is later deleted, pending drafts are DELETED by default unless
        pendingContentPolicy explicitly keeps them with deleted SourceRef metadata.
      properties:
        id:
          type: string
        knowledgeBaseId:
          type: string
        generationTaskId:
          type: string
          description: Persisted generation task id. Present even when generation completed synchronously.
        status:
          $ref: "#/components/schemas/GeneratedContentStatus"
        sourceRefs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
        sourceType:
          $ref: "#/components/schemas/SourceType"
          deprecated: true
        sourceId:
          type: string
          deprecated: true
        questionType:
          $ref: "#/components/schemas/QuestionType"
        stem:
          type: string
        categoryId:
          type: string
        categoryName:
          type: string
        knowledgePointIds:
          type: array
          items:
            type: string
        options:
          type: array
          items:
            type: string
        answer:
          type: array
          items:
            type: string
        explanation:
          type: string
        savedQuestionId:
          type: string
          description: Present after the generated question is saved as a formal question.
        savedAt:
          type: string
          format: date-time
          description: Present after status becomes SAVED.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AiNoteDraft:
      type: object
      required: [id, knowledgeBaseId, generationTaskId, type, title, content, sourceRefs, createdAt]
      properties:
        id:
          type: string
        knowledgeBaseId:
          type: string
        generationTaskId:
          type: string
          description: Persisted generation task id. Present even when generation completed synchronously.
        type:
          $ref: "#/components/schemas/AiNoteType"
        title:
          type: string
        content:
          type: string
        sourceRefs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
        createdAt:
          type: string
          format: date-time
    SaveAiNoteRequest:
      type: object
      required: [knowledgeBaseId, type, title, content, sourceRefs]
      properties:
        draftId:
          type: string
        knowledgeBaseId:
          type: string
        type:
          $ref: "#/components/schemas/AiNoteType"
        title:
          type: string
        content:
          type: string
        sourceRefs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
    SavedAiNote:
      type: object
      required: [id, knowledgeBaseId, type, title, content, sourceRefs, savedAt]
      properties:
        id:
          type: string
        knowledgeBaseId:
          type: string
        type:
          $ref: "#/components/schemas/AiNoteType"
        title:
          type: string
        content:
          type: string
        sourceRefs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
        savedAt:
          type: string
          format: date-time
    SearchResult:
      type: object
      required: [id, type, title, summary, score]
      description: >
        Search result after explicit knowledgeBaseId/materialId scope filtering. Semantic
        results use pgvector similarity over material chunk embeddings in the MVP; other
        result types may be matched by linked chunk/source metadata or keyword fallback.
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/SearchResultType"
        title:
          type: string
        summary:
          type: string
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Normalized relevance score after retrieval and fallback ranking.
        knowledgeBaseId:
          type: string
        knowledgePointIds:
          type: array
          items:
            type: string
        sourceRefs:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
    AskQuestionRequest:
      type: object
      required: [question]
      anyOf:
        - required: [knowledgeBaseId]
        - required: [materialId]
      description: >
        RAG asks are always scoped. Provide at least one of knowledgeBaseId or materialId; the API does
        not perform implicit global question answering. If both are provided, materialId must belong to
        knowledgeBaseId and retrieval is narrowed to that material.
      properties:
        knowledgeBaseId:
          type: string
          description: Required unless materialId is provided.
        materialId:
          type: string
          description: Required unless knowledgeBaseId is provided.
        question:
          type: string
    RagAnswer:
      type: object
      required: [answer, uncertain, citations]
      description: >
        RAG answer constrained to the requested knowledge base or material. When evidence is
        insufficient, uncertain must be true and answer should explicitly say the material
        does not contain enough basis instead of inventing a definitive answer.
      properties:
        answer:
          type: string
        uncertain:
          type: boolean
        uncertaintyReason:
          type: string
          description: Short user-safe reason when uncertain is true, such as INSUFFICIENT_EVIDENCE.
        citations:
          type: array
          description: Source references for chunks actually used in the answer. May be empty only when uncertain is true.
          items:
            $ref: "#/components/schemas/SourceRef"
        evidenceChunks:
          type: array
          items:
            $ref: "#/components/schemas/MaterialChunk"
        savedAiNoteId:
          type: string
    MaterialSourceType:
      type: string
      enum: [MARKDOWN, TXT, PDF]
    MaterialStatus:
      type: string
      enum: [UPLOADED, PARSING, CHUNKING, INDEXING, READY, FAILED, DELETED]
    EmbeddingStatus:
      type: string
      enum: [PENDING, INDEXING, READY, FAILED, INVALIDATED]
      description: >
        Server-side embedding lifecycle for material chunks. INVALIDATED means the source
        material was deleted or the embedding model changed and the vector must not be used.
    DeletedMaterialSavedContentPolicy:
      type: string
      enum: [KEEP_SAVED_CONTENT, DELETE_SAVED_CONTENT]
      default: KEEP_SAVED_CONTENT
      description: >
        KEEP_SAVED_CONTENT retains already saved questions and AI notes, marking their material SourceRef
        objects as deleted. DELETE_SAVED_CONTENT removes saved content derived solely from the deleted
        material; mixed-source content should be retained with only the deleted source marked.
    DeletedMaterialPendingContentPolicy:
      type: string
      enum: [DELETE_PENDING_GENERATED_CONTENT, KEEP_PENDING_GENERATED_CONTENT]
      default: DELETE_PENDING_GENERATED_CONTENT
      description: >
        DELETE_PENDING_GENERATED_CONTENT marks pending generated drafts sourced from the deleted material
        as DELETED. KEEP_PENDING_GENERATED_CONTENT keeps drafts reviewable, but their material SourceRef
        objects must have deleted=true.
    GeneratedContentStatus:
      type: string
      enum: [PENDING_REVIEW, SAVED, DISCARDED, DELETED]
      description: >
        PENDING_REVIEW drafts await user confirmation. SAVED drafts have been converted to formal saved
        content. DISCARDED is an explicit user rejection. DELETED is a soft-deleted generated item,
        including pending drafts removed because their source material was deleted.
    AiNoteType:
      type: string
      enum: [KNOWLEDGE_POINT_EXPLANATION, REVIEW_SUGGESTION, RAG_ANSWER, MANUAL_NOTE]
    AiProviderStatus:
      type: object
      required: [providerType, configured, available]
      description: Sanitized provider status for clients and diagnostics. Secrets are never exposed.
      properties:
        providerType:
          $ref: "#/components/schemas/AiProviderType"
        configured:
          type: boolean
          description: True when required non-secret fields and secret references are configured.
        available:
          type: boolean
          description: False when provider configuration is missing or the adapter is disabled/unreachable.
        baseUrl:
          type: string
          description: Non-secret OpenAI-compatible base URL; omit if it should not be displayed.
        chatModel:
          type: string
        embeddingModel:
          type: string
        embeddingDimensions:
          type: integer
        apiKeyEnvName:
          type: string
          description: Environment variable name used for the key, for example SUILEARN_AI_API_KEY. Never return the key value.
        timeoutMs:
          type: integer
        maxRetries:
          type: integer
        message:
          type: string
          description: User-safe availability or configuration summary.
    AiProviderType:
      type: string
      enum: [FAKE, OPENAI_COMPATIBLE]
    SourceType:
      type: string
      enum: [KNOWLEDGE_POINT, WRONG_QUESTION, MATERIAL, MATERIAL_CHUNK, KNOWLEDGE_BASE, ANSWER_HISTORY]
    SourceRef:
      type: object
      required: [type, id]
      description: >
        Traceability pointer for generated and saved content. If the referenced material or chunk is
        soft-deleted after content is saved, keep the SourceRef for auditability and set deleted=true.
      properties:
        type:
          $ref: "#/components/schemas/SourceType"
        id:
          type: string
        knowledgeBaseId:
          type: string
        title:
          type: string
        materialId:
          type: string
        chunkId:
          type: string
        deleted:
          type: boolean
          description: True when the referenced source, such as a material or material chunk, has been soft deleted and must no longer be used for new search, RAG, or generation.
        excerpt:
          type: string
    QuestionType:
      type: string
      enum: [SINGLE_CHOICE, MULTIPLE_CHOICE, TRUE_FALSE, SHORT_ANSWER]
    SearchResultType:
      type: string
      enum: [QUESTION, KNOWLEDGE_POINT, MATERIAL_CHUNK, GENERATED_CONTENT]
    TaskStatus:
      type: object
      required: [id, kind, status, createdAt, updatedAt]
      description: >
        Persisted status for material import, embedding, and AI generation work. Synchronous
        MVP execution still creates a task and finishes it before returning from the initiating API.
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/TaskKind"
        status:
          $ref: "#/components/schemas/TaskLifecycleStatus"
        knowledgeBaseId:
          type: string
        materialId:
          type: string
        generatedContentId:
          type: string
        providerType:
          $ref: "#/components/schemas/AiProviderType"
        model:
          type: string
          description: Chat or embedding model used by this task; never contains secrets.
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
        currentStep:
          type: string
          description: User-safe step label such as PARSING, CHUNKING, EMBEDDING, GENERATING.
        errorCode:
          type: string
        errorMessage:
          type: string
          description: User-safe error summary. Do not store or return provider raw secrets.
        retryCount:
          type: integer
        resultRef:
          $ref: "#/components/schemas/TaskResultRef"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskResultRef:
      type: object
      properties:
        type:
          type: string
          enum: [MATERIAL, MATERIAL_CHUNKS, GENERATED_CONTENT, AI_NOTE_DRAFT, KNOWLEDGE_POINTS]
        id:
          type: string
        count:
          type: integer
    TaskKind:
      type: string
      enum: [MATERIAL_IMPORT, EMBEDDING, QUESTION_GENERATION, KNOWLEDGE_POINT_EXTRACTION, EXPLANATION_GENERATION, REVIEW_SUGGESTION_GENERATION]
    TaskLifecycleStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
