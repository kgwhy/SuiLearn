name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    name: Workflow Policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check SuiLearn workflow
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-suilearn-workflow.ps1 -BaseRef "$BASE_REF"

  android:
    name: Android Tests And Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Android debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: suilearn_test
          POSTGRES_USER: suilearn
          POSTGRES_PASSWORD: suilearn_dev_password
        options: >-
          --health-cmd "pg_isready -U suilearn -d suilearn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SUILEARN_DB_URL: jdbc:postgresql://localhost:5432/suilearn_test
      SUILEARN_DB_USERNAME: suilearn
      SUILEARN_DB_PASSWORD: suilearn_dev_password
      SUILEARN_TEST_DB_URL: jdbc:postgresql://localhost:5432/suilearn_test
      SUILEARN_TEST_DB_USERNAME: suilearn
      SUILEARN_TEST_DB_PASSWORD: suilearn_dev_password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/api/pom.xml

      - name: Run backend tests
        run: mvn -B -f services/api/pom.xml test -q

  web:
    name: Web Tests And Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run web tests
        run: npm test

      - name: Build web
        run: npm run build
