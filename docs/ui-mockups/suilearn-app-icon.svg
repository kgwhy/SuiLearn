<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">SuiLearn app icon</title>
  <desc id="desc">A soft rounded app icon with a large S, graduation cap, checklist, and open book.</desc>
  <defs>
    <linearGradient id="bg" x1="122" y1="98" x2="904" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7F8F5"/>
    </linearGradient>
    <radialGradient id="wash" cx="45%" cy="39%" r="66%">
      <stop offset="0" stop-color="#EAF2EC" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#EAF2EC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="forest" x1="350" y1="190" x2="698" y2="826" gradientUnits="userSpaceOnUse">
