spring.datasource.url=${SUILEARN_DB_URL:jdbc:h2:file:./data/suilearn-v2;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${SUILEARN_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${SUILEARN_DB_USERNAME:sa}
spring.datasource.password=${SUILEARN_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SUILEARN_DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
