name: suilearn

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SUILEARN_POSTGRES_DB:-suilearn}
      POSTGRES_USER: ${SUILEARN_POSTGRES_USER:-suilearn}
      POSTGRES_PASSWORD: ${SUILEARN_POSTGRES_PASSWORD:-suilearn_dev_password}
    ports:
      - "${SUILEARN_POSTGRES_PORT:-5432}:5432"
    volumes:
      - suilearn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${SPRING_DATA_REDIS_PORT:-6379}:6379"
    volumes:
      - suilearn-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: suilearn-api:local
    restart: unless-stopped
    build:
      context: ./services/api
    environment:
      SUILEARN_DB_URL: ${SUILEARN_DB_URL:-jdbc:postgresql://host.docker.internal:${SUILEARN_POSTGRES_PORT:-5432}/${SUILEARN_POSTGRES_DB:-suilearn}}
      SUILEARN_DB_USERNAME: ${SUILEARN_POSTGRES_USER:-suilearn}
      SUILEARN_DB_PASSWORD: ${SUILEARN_POSTGRES_PASSWORD:-suilearn_dev_password}
      SUILEARN_RABBITMQ_HOST: ${SUILEARN_RABBITMQ_HOST:-rabbitmq}
      SUILEARN_RABBITMQ_PORT: ${SUILEARN_RABBITMQ_PORT:-5672}
      SUILEARN_RABBITMQ_USERNAME: ${SUILEARN_RABBITMQ_USERNAME:-suilearn}
      SUILEARN_RABBITMQ_PASSWORD: ${SUILEARN_RABBITMQ_PASSWORD:-suilearn_rabbitmq_dev_password}
      SUILEARN_RABBITMQ_VHOST: ${SUILEARN_RABBITMQ_VHOST:-suilearn}
      SUILEARN_MINIO_ENDPOINT: ${SUILEARN_MINIO_ENDPOINT:-http://minio:9000}
      SUILEARN_MINIO_ACCESS_KEY: ${SUILEARN_MINIO_ACCESS_KEY:-minioadmin}
      SUILEARN_MINIO_SECRET_KEY: ${SUILEARN_MINIO_SECRET_KEY:-suilearn_minio_dev_password}
      SUILEARN_MINIO_BUCKET: ${SUILEARN_MINIO_BUCKET:-suilearn-assets}
      SUILEARN_ASYNC_PROCESSING_ENABLED: ${SUILEARN_ASYNC_PROCESSING_ENABLED:-true}
      SUILEARN_OCR_ENABLED: ${SUILEARN_OCR_ENABLED:-true}
      SUILEARN_MAX_FILE_SIZE_MB: ${SUILEARN_MAX_FILE_SIZE_MB:-50}
      SUILEARN_PDF_MAX_PAGES: ${SUILEARN_PDF_MAX_PAGES:-500}
      SUILEARN_PROCESSING_CONCURRENCY: ${SUILEARN_PROCESSING_CONCURRENCY:-2}
      SUILEARN_OCR_CONCURRENCY: ${SUILEARN_OCR_CONCURRENCY:-1}
      SUILEARN_RETAIN_ORIGINAL: ${SUILEARN_RETAIN_ORIGINAL:-true}
      SUILEARN_KNOWLEDGE_POINT_AUTO_GENERATION_ENABLED: ${SUILEARN_KNOWLEDGE_POINT_AUTO_GENERATION_ENABLED:-true}
      SUILEARN_PROCESSING_MAX_ATTEMPTS: ${SUILEARN_PROCESSING_MAX_ATTEMPTS:-3}
      SUILEARN_RABBITMQ_RETRY_SHORT_DELAY_MS: ${SUILEARN_RABBITMQ_RETRY_SHORT_DELAY_MS:-30000}
      SUILEARN_RABBITMQ_RETRY_LONG_DELAY_MS: ${SUILEARN_RABBITMQ_RETRY_LONG_DELAY_MS:-300000}
      SUILEARN_PARSER_TIMEOUT_MS: ${SUILEARN_PARSER_TIMEOUT_MS:-120000}
      SUILEARN_OCR_TIMEOUT_MS: ${SUILEARN_OCR_TIMEOUT_MS:-60000}
      SUILEARN_LIBREOFFICE_TIMEOUT_MS: ${SUILEARN_LIBREOFFICE_TIMEOUT_MS:-120000}
      SUILEARN_WEB_CORS_ALLOWED_ORIGINS: http://localhost:${SUILEARN_WEB_PORT:-5174},http://127.0.0.1:${SUILEARN_WEB_PORT:-5174}
      SUILEARN_AI_PROVIDER: ${SUILEARN_AI_PROVIDER:-openai-compatible}
      SUILEARN_AI_BASE_URL: ${SUILEARN_AI_BASE_URL:-}
      SUILEARN_AI_API_KEY: ${SUILEARN_AI_API_KEY:-}
      SUILEARN_AI_CHAT_BASE_URL: ${SUILEARN_AI_CHAT_BASE_URL:-}
      SUILEARN_AI_CHAT_API_KEY: ${SUILEARN_AI_CHAT_API_KEY:-}
      SUILEARN_AI_EMBEDDING_BASE_URL: ${SUILEARN_AI_EMBEDDING_BASE_URL:-}
      SUILEARN_AI_EMBEDDING_API_KEY: ${SUILEARN_AI_EMBEDDING_API_KEY:-}
      SUILEARN_AI_CHAT_MODEL: ${SUILEARN_AI_CHAT_MODEL:-}
      SUILEARN_AI_EMBEDDING_MODEL: ${SUILEARN_AI_EMBEDDING_MODEL:-}
      SUILEARN_AI_TIMEOUT_MS: ${SUILEARN_AI_TIMEOUT_MS:-30000}
      SUILEARN_AGENT_ENABLED: ${SUILEARN_AGENT_ENABLED:-false}
      SUILEARN_AGENT_WEBSOCKET_ENABLED: ${SUILEARN_AGENT_WEBSOCKET_ENABLED:-true}
      SUILEARN_AGENT_MAX_STEPS: ${SUILEARN_AGENT_MAX_STEPS:-4}
      SUILEARN_AGENT_SUBAGENT_MAX_STEPS: ${SUILEARN_AGENT_SUBAGENT_MAX_STEPS:-3}
      SUILEARN_AGENT_MAX_TOOL_CALLS: ${SUILEARN_AGENT_MAX_TOOL_CALLS:-8}
      SUILEARN_AGENT_RUN_TIMEOUT: ${SUILEARN_AGENT_RUN_TIMEOUT:-90s}
      SUILEARN_AGENT_CONTEXT_MAX_TOKENS: ${SUILEARN_AGENT_CONTEXT_MAX_TOKENS:-12000}
      SUILEARN_AGENT_PRACTICE_DEFAULT_COUNT: ${SUILEARN_AGENT_PRACTICE_DEFAULT_COUNT:-3}
      SUILEARN_AGENT_SESSION_TTL: ${SUILEARN_AGENT_SESSION_TTL:-24h}
      SUILEARN_AGENT_SESSION_MAX_TURNS: ${SUILEARN_AGENT_SESSION_MAX_TURNS:-20}
      SUILEARN_AGENT_MEMORY_TOP_K: ${SUILEARN_AGENT_MEMORY_TOP_K:-5}
      SUILEARN_AGENT_MEMORY_MIN_CONFIDENCE: ${SUILEARN_AGENT_MEMORY_MIN_CONFIDENCE:-0.80}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SUILEARN_ADAPTER_MAX_RETRIES: ${SUILEARN_ADAPTER_MAX_RETRIES-}
      SUILEARN_AI_MAX_RETRIES: ${SUILEARN_AI_MAX_RETRIES-}
      SUILEARN_CIRCUIT_BREAKER_FAILURE_RATE_PERCENT: ${SUILEARN_CIRCUIT_BREAKER_FAILURE_RATE_PERCENT:-50}
      SUILEARN_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE: ${SUILEARN_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:-10}
      SUILEARN_CIRCUIT_BREAKER_MINIMUM_CALLS: ${SUILEARN_CIRCUIT_BREAKER_MINIMUM_CALLS:-5}
      SUILEARN_CIRCUIT_BREAKER_OPEN_STATE_MS: ${SUILEARN_CIRCUIT_BREAKER_OPEN_STATE_MS:-60000}
      SUILEARN_CIRCUIT_BREAKER_HALF_OPEN_CALLS: ${SUILEARN_CIRCUIT_BREAKER_HALF_OPEN_CALLS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SUILEARN_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/ai/provider-status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.1.3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${SUILEARN_RABBITMQ_USERNAME:-suilearn}
      RABBITMQ_DEFAULT_PASS: ${SUILEARN_RABBITMQ_PASSWORD:-suilearn_rabbitmq_dev_password}
      RABBITMQ_DEFAULT_VHOST: ${SUILEARN_RABBITMQ_VHOST:-suilearn}
    ports:
      - "${SUILEARN_RABBITMQ_PORT:-5672}:5672"
      - "${SUILEARN_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - suilearn-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SUILEARN_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SUILEARN_MINIO_SECRET_KEY:-suilearn_minio_dev_password}
    ports:
      - "${SUILEARN_MINIO_PORT:-9000}:9000"
      - "${SUILEARN_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - suilearn-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: suilearn-web:local
    restart: unless-stopped
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v2}
    environment:
      SUILEARN_API_UPSTREAM: ${SUILEARN_API_UPSTREAM:-http://host.docker.internal:${SUILEARN_API_PORT:-8080}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SUILEARN_WEB_PORT:-5174}:80"

volumes:
  suilearn-postgres-data:
  suilearn-redis-data:
  suilearn-rabbitmq-data:
  suilearn-minio-data:
